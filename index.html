<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Mercader · Sobres de Bonificación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ew:420px; --eh:280px; --cw:280px; --ch:394px; --edy:96px;
  --gold:#e8c872; --seal:#e8c872; --glow:#e8c872;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08201b;overflow:hidden}
body{font-family:'Cinzel',Georgia,'Times New Roman',serif;color:#f3e6bf;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}

.app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 80% 70% at 50% 42%,#10403a 0%,#0c2c26 40%,#08201b 100%)}

/* ---------- escenario ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;bottom:-10px;border-radius:50%;background:radial-gradient(circle,#fff6cf 0%,rgba(255,232,150,.0) 70%);
  opacity:0;animation:floaty linear infinite}
@keyframes floaty{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}

.title{position:absolute;left:0;right:0;top:0;height:var(--top,52px);display:flex;align-items:center;justify-content:center;
  font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12px,min(2.6vh,3.9vw),22px);padding:0 48px;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#fff2c2,#d9ab4a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));pointer-events:none;z-index:6}
.compact .title{display:none}
.fs{position:absolute;right:10px;top:10px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid rgba(232,200,114,.5);
  background:rgba(0,0,0,.4);cursor:pointer;display:none;align-items:center;justify-content:center}
.fs.ok{display:flex}
.fs svg{width:16px;height:16px;stroke:#e8c872;fill:none;stroke-width:2}

.arena{position:absolute;left:0;right:0;bottom:0;top:var(--top,52px)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}

/* ---------- sobre ---------- */
.eslot{position:absolute;left:50%;top:50%;width:var(--ew);height:var(--eh);
  margin:calc(var(--eh) / -2 + var(--edy)) 0 0 calc(var(--ew) / -2);z-index:5}
.burst{position:absolute;left:50%;top:38%;width:calc(var(--ew)*1.7);height:calc(var(--ew)*1.7);margin:calc(var(--ew)*-.85) 0 0 calc(var(--ew)*-.85);
  border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(0,0,0,0) 62%);opacity:0;transform:scale(.2);pointer-events:none;z-index:1}
.burst.boom{animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.2)}25%{opacity:.85}100%{opacity:0;transform:scale(1.15)}}

.env{position:absolute;inset:0;perspective:1000px;cursor:pointer;background:none;border:0;outline:0;
  filter:drop-shadow(0 20px 22px rgba(0,0,0,.65));transition:opacity .55s ease,transform .6s ease;z-index:2}
.env:focus-visible .back{outline:3px solid #fff2c2;outline-offset:4px}
.env.float{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-2.5%) rotate(.4deg)}}
.env.shake{animation:shake .6s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-3%) rotate(-3deg)}28%{transform:translateX(3%) rotate(3deg)}44%{transform:translateX(-3%) rotate(-2.5deg)}60%{transform:translateX(2.5%) rotate(2deg)}78%{transform:translateX(-1.5%) rotate(-1deg)}}
.env.away{opacity:0;transform:translateY(7%) scale(.9);pointer-events:none}
.env.drop{animation:drop .6s cubic-bezier(.2,.9,.3,1.1)}
@keyframes drop{0%{opacity:0;transform:translateY(-14%) scale(.85)}100%{opacity:1;transform:none}}
.env.reset,.env.reset *{transition:none!important;animation:none!important}

.env .back{position:absolute;inset:0;border-radius:calc(var(--eh)*.035);
  background:
   radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.14),transparent 55%),
   linear-gradient(160deg,#8b6d3d,#6f5530);z-index:1}
.env .peek{position:absolute;left:50%;bottom:6%;width:calc(var(--ew)*.42);height:calc(var(--ew)*.42*641/455);
  margin-left:calc(var(--ew)*-.21);border-radius:calc(var(--ew)*.02);overflow:hidden;z-index:3;
  transition:transform .85s cubic-bezier(.2,.9,.25,1);box-shadow:0 0 18px rgba(0,0,0,.5)}
.env .peek img{width:100%;height:100%;display:block;object-fit:cover}
.env.open .peek{transform:translateY(calc(var(--ew)*-.5))}
.pocket i{position:absolute;inset:0;z-index:4}
.pocket .l{clip-path:polygon(0 0,52% 56%,0 100%);background:linear-gradient(100deg,#b99b62,#d6ba82)}
.pocket .r{clip-path:polygon(100% 0,48% 56%,100% 100%);background:linear-gradient(260deg,#b39459,#d2b57b)}
.pocket .b{clip-path:polygon(0 100%,50% 42%,100% 100%);background:linear-gradient(0deg,#dcc48e,#ecd9a6);border-radius:0 0 calc(var(--eh)*.035) calc(var(--eh)*.035)}
.pocket .grain{clip-path:none;opacity:.18;mix-blend-mode:multiply;z-index:4;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.flap{position:absolute;left:0;top:0;width:100%;height:60%;z-index:5;transform-origin:50% 0}
.flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#a98a52,#cfb077)}
.env.open .flap{animation:flapOpen .6s ease-in forwards}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:5}49%{z-index:5}50%{transform:rotateX(90deg);z-index:2}100%{transform:rotateX(180deg);z-index:2}}
.elabel{position:absolute;left:0;right:0;bottom:6.5%;text-align:center;z-index:6;font-weight:800;text-transform:uppercase;
  letter-spacing:.16em;font-size:calc(var(--eh)*.072);color:#5a4220;text-shadow:0 1px 0 rgba(255,255,255,.35);pointer-events:none;white-space:nowrap}
.seal{position:absolute;left:50%;top:60%;width:calc(var(--eh)*.3);height:calc(var(--eh)*.3);margin:calc(var(--eh)*-.15) 0 0 calc(var(--eh)*-.15);z-index:7;
  transition:filter .4s;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.env.float .seal{animation:sealpulse 2.4s ease-in-out infinite}
@keyframes sealpulse{0%,100%{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 4px var(--seal))}50%{filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)) drop-shadow(0 0 16px var(--seal))}}
.env.open .seal{animation:sealbreak .5s ease-in forwards}
@keyframes sealbreak{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(.2) rotate(40deg);opacity:0}}

.hint{position:absolute;left:0;right:0;bottom:2.5%;text-align:center;font-size:clamp(11px,1.9vh,15px);letter-spacing:.2em;text-transform:uppercase;
  color:#cdb987;opacity:.85;animation:blink 2.6s ease-in-out infinite;pointer-events:none;z-index:4;transition:opacity .3s}
@keyframes blink{50%{opacity:.35}}
.hint.off{opacity:0;animation:none}

/* ---------- carta revelada ---------- */
.rslot{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);margin:calc(var(--ch)/-2) 0 0 calc(var(--cw)/-2);
  perspective:1400px;z-index:10;visibility:hidden;opacity:0}
.rslot.show{visibility:visible;opacity:1}
.rslot.fade{transition:opacity .35s ease}
.rslot.hide{opacity:0}
.aura{position:absolute;inset:-7%;border-radius:9%;background:radial-gradient(closest-side,var(--glow) 40%,rgba(0,0,0,0) 100%);opacity:0;filter:blur(16px);transition:opacity .6s;pointer-events:none}
.rslot.glow .aura{opacity:.7;animation:aura 2.8s ease-in-out infinite}
@keyframes aura{50%{opacity:.4;transform:scale(1.04)}}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .18s ease-out}
.rcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.75,.25,1)}
.rcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw)*.05);overflow:hidden;
  background:#000;box-shadow:0 22px 46px rgba(0,0,0,.7)}
.face img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.face.front{transform:rotateY(180deg)}
.shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .25s}
.rslot.live:hover .shine{opacity:1}

/* ---------- barra inferior ---------- */
.bar{flex:none;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55) 40%);position:relative;z-index:8}
.packs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pack{--c:#e8c872;display:flex;align-items:center;gap:.5em;padding:.55em .95em;border-radius:99px;cursor:pointer;
  border:1px solid var(--c);background:rgba(0,0,0,.4);font-weight:600;font-size:clamp(11px,1.75vh,14px);line-height:1;letter-spacing:.04em;white-space:nowrap;
  transition:background .2s,color .2s,transform .15s}
.pack::before{content:"";width:.62em;height:.62em;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.pack:hover{transform:translateY(-1px)}
.pack[aria-pressed="true"]{background:var(--c);color:#101410}
.pack[aria-pressed="true"]::before{background:#101410;box-shadow:none}
.pack:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.go{cursor:pointer;border:1px solid #f6dc95;border-radius:99px;padding:.7em 1.7em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  font-size:clamp(12px,1.9vh,15px);color:#2a1d05;background:linear-gradient(180deg,#ffe9a6,#d9a94a);
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,filter .2s}
.go:hover{transform:translateY(-1px);filter:brightness(1.08)}
.go:active{transform:translateY(1px)}
.go:disabled{filter:grayscale(.6) brightness(.7);cursor:default;transform:none}
.hist{display:flex;align-items:center;gap:6px;min-height:var(--th,46px)}
.hist[hidden]{display:none}
.hist span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8956a;margin-right:2px}
.hist button{--th:46px;height:var(--th);width:calc(var(--th)*455/641);border:1px solid rgba(232,200,114,.5);border-radius:4px;padding:0;overflow:hidden;
  background:#000;cursor:pointer;transition:transform .15s}
.hist button:hover{transform:translateY(-3px)}
.hist img{width:100%;height:100%;object-fit:cover;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.compact .hist{display:none}

/* ---------- pestañas ---------- */
.tabs{flex:none;display:flex;justify-content:center;gap:8px;padding:10px 56px 4px;position:relative;z-index:9}
.tab{cursor:pointer;background:rgba(0,0,0,.35);border:1px solid rgba(232,200,114,.45);color:#e8d7a4;padding:.6em 1.3em;border-radius:99px;
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(11px,1.8vh,14px);line-height:1;transition:transform .15s,filter .2s}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#ffe9a6,#d9a94a);color:#2a1d05;border-color:#f6dc95}
.tab:disabled{opacity:.5;cursor:default;transform:none}
.tab[hidden]{display:none}
.app[data-vista="compra"] .tabs{display:none}
.app[data-vista="compra"] .packs{display:none}
.app[data-vista="tienda"] .stage,.app[data-vista="tienda"] .bar{display:none}
.app:not([data-vista="tienda"]) .shop{display:none}

/* ---------- mercader ---------- */
.shop{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 32px;scrollbar-width:thin;scrollbar-color:#6b5a2e transparent}
.shop-in{max-width:1000px;margin:0 auto}
.hero{display:block;width:100%;height:auto;aspect-ratio:5/2;background:#0a2621;border-radius:14px;border:1px solid rgba(232,200,114,.4);box-shadow:0 12px 28px rgba(0,0,0,.6);margin:6px 0 14px}
.merch{display:block;margin:0 0 2px}
.merch-art{flex:none;width:clamp(72px,15vw,120px);height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.65))}
.merch-txt{flex:1;min-width:0}
.fecha{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#bda76f;margin-bottom:6px}
.bubble{position:relative;background:linear-gradient(180deg,#f3e5bd,#dcc48e);color:#3b2a10;padding:12px 16px;border-radius:14px;
  font-family:Georgia,'Times New Roman',serif;font-size:clamp(14px,2.3vh,18px);line-height:1.4;box-shadow:0 6px 16px rgba(0,0,0,.5)}
h2.sec{font-size:clamp(13px,2vh,16px);letter-spacing:.22em;text-transform:uppercase;color:#e8c872;margin:22px 0 14px;display:flex;align-items:center;gap:12px;font-weight:800}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(232,200,114,.55),transparent)}
.ofertas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,178px),1fr));gap:14px}
.aviso{font-family:Georgia,serif;color:#cdb987;font-size:14px;margin:6px 0 0}

.prod{--c:#e8c872;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:18px 12px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.38));border:1px solid var(--c);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.prod.feat{border-width:2px;box-shadow:0 0 26px -6px var(--c),0 8px 18px rgba(0,0,0,.45)}
.prod .art{width:min(64%,112px);height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.prod.feat .art{width:min(52%,132px)}
.prod h3{font-size:clamp(13px,2vh,16px);letter-spacing:.04em;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.prod .sub{font-size:11px;color:#b9a878;letter-spacing:.05em;margin-top:-4px}
.badge{position:absolute;top:-11px;left:12px;background:linear-gradient(180deg,#ffe9a6,#d9a94a);color:#2a1d05;font-weight:800;letter-spacing:.08em;
  padding:.32em .85em;border-radius:99px;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.55)}
.precio{display:flex;align-items:center;gap:7px;justify-content:center}
.precio b{font-size:26px;color:#ffe9a6;line-height:1}
.precio s{color:#a08a5a;font-size:15px}
.precio i{font-style:normal;font-size:11px;color:#bda76f;letter-spacing:.14em;text-transform:uppercase}
.precio svg{width:20px;height:20px;flex:none}
.oferta-txt{font-family:Georgia,serif;font-size:13px;color:#e8d7a4;min-height:1.3em}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--c);background:rgba(0,0,0,.4);cursor:pointer;font-size:19px;line-height:1;font-weight:800}
.qty button:hover:not(:disabled){background:var(--c);color:#101410}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{min-width:2ch;font-weight:800;font-size:20px}
.total{font-size:13px;color:#e8d7a4;min-height:2.9em}
.total b{color:#ffe9a6;font-size:17px}
.total em{display:block;font-style:normal;color:#8be29a;font-size:12px;letter-spacing:.04em}
.buy{width:100%;cursor:pointer;border:1px solid #f6dc95;border-radius:99px;padding:.7em 1em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;
  color:#2a1d05;background:linear-gradient(180deg,#ffe9a6,#d9a94a);box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,filter .2s}
.buy:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.buy:disabled{filter:grayscale(.7) brightness(.65);cursor:default}

.semana{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.dia{padding:10px 12px;border-radius:10px;border:1px solid rgba(232,200,114,.25);background:rgba(0,0,0,.32);font-size:12px;line-height:1.55}
.dia.hoy{border-color:#e8c872;background:rgba(232,200,114,.12)}
.dia h4{letter-spacing:.14em;text-transform:uppercase;color:#e8c872;font-size:12px;margin-bottom:5px}
.dia ul{list-style:none}
.dia .cerr{color:#a08a5a}
.caja-row{display:flex;justify-content:center;margin-top:24px}
.ghost{cursor:pointer;background:rgba(0,0,0,.35);border:1px solid rgba(232,200,114,.45);color:#e8d7a4;padding:.65em 1.4em;border-radius:99px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.ghost:hover{background:rgba(232,200,114,.15)}

/* ---------- ventanas ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{width:min(100%,440px);max-height:100%;overflow:auto;background:linear-gradient(180deg,#123a33,#0a211d);border:1px solid #e8c872;border-radius:16px;
  padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.modal-box h3{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#e8c872;margin-bottom:12px}
.modal-box p{font-family:Georgia,serif;line-height:1.45;margin-bottom:8px}
.mtot{font-size:20px}
.mtot b{font-size:32px;color:#ffe9a6}
.mtot span{font-size:14px;color:#8be29a;margin-left:6px}
.nota{color:#bda76f;font-size:14px}
.modal-box label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#bda76f;margin:12px 0 4px}
.modal-box input{width:100%;padding:.65em .8em;border-radius:8px;border:1px solid rgba(232,200,114,.5);background:rgba(0,0,0,.4);color:#f3e6bf;font:16px Georgia,serif}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lista{list-style:none;font-family:Georgia,serif;font-size:14px;line-height:1.4;max-height:44vh;overflow:auto;margin-bottom:10px}
.lista li{padding:7px 0;border-bottom:1px solid rgba(232,200,114,.18)}
.lista .vacio{color:#a08a5a;border:0}

@media (prefers-reduced-motion:reduce){
  .mote,.env.float,.hint,.env.float .seal,.rslot.glow .aura{animation:none!important}
}
</style>
</head>
<body>
<div class="app" id="app" data-vista="tienda">
  <button class="fs" id="fs" type="button" aria-label="Pantalla completa" title="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sección">
    <button class="tab" id="tabTienda" role="tab" aria-selected="true" type="button">El Mercader</button>
    <button class="tab" id="tabSobres" role="tab" aria-selected="false" type="button">Sobres</button>
  </nav>
  <section class="shop" id="shop" aria-label="El Mercader">
    <div class="shop-in">
      <img class="hero" id="hero" alt="El Mercader · Sobres de Bonificación · Maestro Javii72" draggable="false">
      <header class="merch">
        <div class="merch-txt">
          <div class="fecha" id="fecha"></div>
          <div class="bubble" id="bubble"></div>
        </div>
      </header>
      <h2 class="sec" id="tOfertas">Ofertas de hoy</h2>
      <div class="ofertas" id="ofertas"></div>
      <h2 class="sec">Resto de sobres</h2>
      <div class="grid" id="grid"></div>
      <h2 class="sec">Ofertas de la semana</h2>
      <div class="semana" id="semana"></div>
      <div class="caja-row"><button class="ghost" id="cajaBtn" type="button">Caja de la sesión</button></div>
    </div>
  </section>
  <div class="stage" id="stage">
    <div class="motes" id="motes" aria-hidden="true"></div>
    <div class="title" id="stageTitle">Sobres de Bonificación</div>
    <div class="arena" id="arena">
      <div class="eslot" id="eslot">
        <div class="burst" id="burst"></div>
        <button class="env float" id="env" type="button" aria-label="Abrir el sobre">

/* ---------- sorteo ---------- */
function elegirTipo(){
  var tot=0, t, i;
  for(i=0;i<ORDEN.length;i++){ t=ORDEN[i]; if(porTipo[t].length) tot += Math.max(0, CONFIG.pesos[t]||0); }
  if(tot<=0){ /* pesos a 0: reparte por número de cartas */
    var n=cartas.length, k=Math.floor(rnd()*n); return cartas[k].tipo;
  }
  var r=rnd()*tot;
  for(i=0;i<ORDEN.length;i++){
    t=ORDEN[i]; if(!porTipo[t].length) continue;
    r -= Math.max(0, CONFIG.pesos[t]||0);
    if(r<0) return t;
  }
  return ORDEN[0];
}
function sacarCarta(){
  var t = pack==='random' ? elegirTipo() : pack;
  var arr = porTipo[t];
  return arr[Math.floor(rnd()*arr.length)];
}

/* ---------- tamaños ---------- */
function layout(){
  var r=stage.getBoundingClientRect(), W=r.width, H=r.height;
  if(!W||!H) return;
  var compact = H<400;
  document.getElementById('app').classList.toggle('compact', compact);
  var top = compact ? 0 : Math.min(56, Math.max(36, H*.1));
  var root=document.documentElement.style;
  root.setProperty('--top', top+'px');
  var ah=H-top, aw=W;
  var eh=Math.min(ah*.5, aw*.8/1.5), ew=eh*1.5;
  var ch=Math.min(ah*.97, aw*.92*641/455), cw=ch*455/641;
  root.setProperty('--ew', ew+'px'); root.setProperty('--eh', eh+'px');
  root.setProperty('--edy', (ew*.23)+'px');
  root.setProperty('--cw', cw+'px'); root.setProperty('--ch', ch+'px');
  fxResize();
}
if(window.ResizeObserver){ new ResizeObserver(layout).observe(stage); }
window.addEventListener('resize', layout);

/* ---------- partículas ---------- */
var cv=$('fx'), ctx=cv.getContext('2d'), parts=[], raf=0, dpr=1;
function fxResize(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  var r=arena.getBoundingClientRect();
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
}
function centroDe(el){
  var a=arena.getBoundingClientRect(), b=el.getBoundingClientRect();
  return { x:b.left+b.width/2-a.left, y:b.top+b.height/2-a.top, w:b.width, h:b.height };
}
function chispas(x,y,color,n,vel,spread){
  if(reduce) return;
  for(var i=0;i<n;i++){
    var ang=rnd()*Math.PI*2, sp=(.35+rnd())*vel;
    parts.push({ x:x+(rnd()-.5)*(spread||0), y:y+(rnd()-.5)*(spread||0),
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-vel*.25, life:0, max:55+rnd()*70, r:1+rnd()*2.8,
      c: rnd()<.35 ? '#fff6cf' : color });
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='lighter';
  var alive=[];
  for(var i=0;i<parts.length;i++){
    var p=parts[i]; p.life++; if(p.life>p.max) continue;
    p.x+=p.vx; p.y+=p.vy; p.vy+=.035; p.vx*=.985; p.vy*=.99;
    var a=1-p.life/p.max;
    ctx.globalAlpha=a*.35; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.6,0,6.283); ctx.fill();
    ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    alive.push(p);
  }
  parts=alive;
  if(parts.length){ raf=requestAnimationFrame(tick); }
  else { raf=0; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); }
}

/* motas de polvo mágico de fondo */
(function(){
  if(reduce) return;
  var m=$('motes');
  for(var i=0;i<16;i++){
    var d=document.createElement('i'); d.className='mote';
    var s=3+Math.random()*6;
    d.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(11+Math.random()*14)+'s;animation-delay:'+(-Math.random()*20)+'s';
    m.appendChild(d);
  }
})();

/* ---------- selector de sobre ---------- */
function crearPacks(){
  var opts=[{id:'random', n:'✦ Sorpresa', c:GOLD}];
  ORDEN.forEach(function(t){ if(porTipo[t].length) opts.push({id:t, n:TIPOS[t].n, c:TIPOS[t].c}); });
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.type='button'; b.className='pack'; b.textContent=o.n; b.dataset.id=o.id;
    b.style.setProperty('--c', o.c);
    b.setAttribute('aria-pressed', o.id===pack?'true':'false');
    b.addEventListener('click', function(e){ soltar(e); elegirPack(o.id); });
    packsEl.appendChild(b);
  });
}
function elegirPack(id){
  if(estado==='busy') return;
  pack=id; packLibre=id;
  Array.prototype.forEach.call(packsEl.children, function(b){ b.setAttribute('aria-pressed', b.dataset.id===id?'true':'false'); });
  var col = id==='random' ? GOLD : TIPOS[id].c;
  document.documentElement.style.setProperty('--seal', col);
  elabel.textContent = id==='random' ? 'Pack sorpresa' : 'Sobre · '+TIPOS[id].plural;
  if(estado==='shown'){ cerrar(); }
}

/* ---------- historial ---------- */
function pintarHistorial(){
  histEl.querySelectorAll('button').forEach(function(b){ b.remove(); });
  historial.forEach(function(c){
    var b=document.createElement('button'); b.type='button';
    b.title=TIPOS[c.tipo].n+' · carta '+c.id; b.setAttribute('aria-label','Ver de nuevo: carta '+TIPOS[c.tipo].n+' nº '+c.id);
    b.style.borderColor=TIPOS[c.tipo].c;
    var im=new Image(); im.src=c.src; im.alt=''; im.draggable=false; b.appendChild(im);
    b.addEventListener('click', function(e){ soltar(e); if(estado==='busy') return; mostrarDirecto(c); });
    histEl.appendChild(b);
  });
  histEl.hidden = historial.length===0;
}

/* ---------- flujo principal ---------- */
function setGlow(t){ document.documentElement.style.setProperty('--glow', TIPOS[t].c); }
function setBoton(){
  var fin = !!cola && cola.hechos>=cola.total;
  if(estado==='shown'){
    goBtn.textContent = cola ? (fin ? 'Volver al mercader' : 'Siguiente sobre ('+(cola.hechos+1)+'/'+cola.total+')') : 'Otro sobre';
  } else {
    goBtn.textContent = 'Abrir sobre';
  }
  goBtn.disabled = estado==='busy';
  Array.prototype.forEach.call(packsEl.children, function(b){ b.disabled = estado==='busy'; });
  tabTienda.disabled = tabSobres.disabled = estado==='busy';
  hint.textContent = cola ? 'Toca el sobre para abrirlo · '+Math.min(cola.hechos+1,cola.total)+' de '+cola.total : 'Toca el sobre para abrirlo';
  hint.classList.toggle('off', estado!=='idle');
}
function anunciar(c){ live.textContent='Ha salido una carta de tipo '+TIPOS[c.tipo].n+', número '+c.id+'.'; }
function registrar(c){
  historial.unshift(c); if(historial.length>8) historial.pop();
  pintarHistorial(); anunciar(c);
}

async function abrir(){
  if(estado!=='idle') return;
  estado='busy'; setBoton();
  var carta=sacarCarta();
  frontImg.src=carta.src; frontImg.alt='Carta '+TIPOS[carta.tipo].n+' nº '+carta.id;
  var dec = frontImg.decode ? frontImg.decode().catch(function(){}) : Promise.resolve();
  setGlow(carta.tipo);

  if(reduce){
    await dec; if(cola) cola.hechos++; mostrarDirecto(carta); registrar(carta); return;
  }

  env.classList.remove('float'); env.classList.add('shake');
  await Promise.all([sleep(620), dec]);
  env.classList.remove('shake'); env.classList.add('open');
  burstEl.classList.remove("boom"); void burstEl.offsetWidth; burstEl.classList.add("boom");
  var ce=centroDe(env);
  chispas(ce.x, ce.y-ce.h*.1, TIPOS[carta.tipo].c, 46, 3.4, ce.w*.3);
  await sleep(1150);

  /* la carta pasa del sobre al centro (FLIP) */
  var pr=$('peekImg').parentNode.getBoundingClientRect();
  rslot.classList.remove('fade','hide'); rslot.style.transition='none'; rslot.style.transform='none';
  rslot.classList.add('show');
  var rr=rslot.getBoundingClientRect();
  var dx=(pr.left+pr.width/2)-(rr.left+rr.width/2), dy=(pr.top+pr.height/2)-(rr.top+rr.height/2), s=pr.width/rr.width;
  rslot.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
  $('peekImg').parentNode.style.visibility='hidden';
  void rslot.offsetWidth;
  rslot.style.transition='transform 1s cubic-bezier(.22,.8,.22,1)';
  rslot.style.transform='none';
  env.classList.add('away');
  await sleep(1050);
  rslot.style.transition='';

  if(CONFIG.autoVoltear){
    await sleep(CONFIG.pausaVolteo);
    rcard.classList.add('flip');
    await sleep(380);
    var cc=centroDe(rslot);
    var extra = (carta.tipo==='reliquia'||carta.tipo==='horrocrux') ? 2 : 1;
    chispas(cc.x, cc.y, TIPOS[carta.tipo].c, 70*extra, 4.6, cc.w*.5);
    rslot.classList.add('glow','live');
    await sleep(700);
  } else {
    rslot.classList.add('live');
  }
  if(cola) cola.hechos++;
  estado='shown'; setBoton(); registrar(carta);
}

/* muestra una carta ya girada, sin animación de sobre */
function mostrarDirecto(c){
  frontImg.src=c.src; frontImg.alt='Carta '+TIPOS[c.tipo].n+' nº '+c.id;
  setGlow(c.tipo);
  var yaVisible = rslot.classList.contains('show');
  rcard.style.transition='none';
  rslot.style.transition=''; rslot.style.transform='none';
  rslot.classList.remove('hide'); rslot.classList.add('show','glow','live');
  rcard.classList.add('flip'); void rcard.offsetWidth; rcard.style.transition='';
  env.classList.add('away'); env.classList.remove('float','shake');
  if(!yaVisible){ rslot.classList.add('fade'); rslot.style.opacity='0'; void rslot.offsetWidth; rslot.style.opacity=''; }
  estado='shown'; setBoton(); anunciar(c);
}

/* vuelve al sobre cerrado */
async function cerrar(){
  if(estado==='busy') return;
  estado='busy'; setBoton();
  rslot.classList.add('fade','hide'); rslot.classList.remove('glow','live');
  await sleep(380);
  rslot.classList.remove('show','fade','hide');
  rcard.style.transition='none'; rcard.classList.remove('flip'); tilt.style.transform='';
  rslot.style.transition='none'; rslot.style.transform='none';
  void rcard.offsetWidth; rcard.style.transition=''; rslot.style.transition='';
  env.classList.add('reset'); env.classList.remove('open','away','shake');
  $('peekImg').parentNode.style.visibility='';
  void env.offsetWidth;
  env.classList.remove('reset'); env.classList.add('drop');
  await sleep(620);
  env.classList.remove('drop'); env.classList.add('float');
  estado='idle'; setBoton();
}

goBtn.addEventListener('click', function(e){ soltar(e); accion(); });
document.addEventListener('keydown', function(e){
  if(!mConf.hidden || !mCaja.hidden){ if(e.key==='Escape') cerrarModales(); return; }
  if(e.target!==document.body) return;
  if(appEl.dataset.vista==='tienda') return;

function resetSobre(){
  rslot.classList.remove('show','fade','hide','glow','live');
  rslot.style.transition='none'; rslot.style.transform='none'; rslot.style.opacity='';
  rcard.style.transition='none'; rcard.classList.remove('flip'); tilt.style.transform='';
  env.classList.add('reset'); env.classList.remove('open','away','shake','drop'); env.classList.add('float');
  $('peekImg').parentNode.style.visibility='';
  void env.offsetWidth;
  env.classList.remove('reset'); rcard.style.transition=''; rslot.style.transition='';
  estado='idle';
}
function aplicarLibre(){
  pack=packLibre;
  document.documentElement.style.setProperty('--seal', pack==='random' ? GOLD : TIPOS[pack].c);
  elabel.textContent = pack==='random' ? 'Pack sorpresa' : 'Sobre · '+TIPOS[pack].plural;
  stageTitle.textContent = 'Sobres de Bonificación';
  histLabel.textContent = 'Últimas';
  Array.prototype.forEach.call(packsEl.children, function(b){ b.setAttribute('aria-pressed', b.dataset.id===pack?'true':'false'); });
}
function setVista(v){
  appEl.dataset.vista = v;
  tabTienda.setAttribute('aria-selected', v==='tienda' ? 'true' : 'false');
  tabSobres.setAttribute('aria-selected', v==='sobres' ? 'true' : 'false');
  if(v==='sobres') aplicarLibre();
  if(v==='tienda') shopEl.scrollTop=0;
  layout();
  pintarHistorial();
  setBoton();
}
function accion(){
  if(estado==='idle') abrir();
  else if(estado==='shown'){
    if(cola && cola.hechos>=cola.total) salirCompra(); else cerrar();
  }
}
function iniciarCompra(p, qty){
  resetSobre();
  histLibre = historial; historial = [];
  cola = { p:p, total:qty, hechos:0 };
  pack = p.pack;
  document.documentElement.style.setProperty('--seal', p.color);
  elabel.textContent = p.id==='aleatorio' ? 'Pack sorpresa' : 'Sobre · '+TIPOS[p.id].plural;
  stageTitle.textContent = 'Tus sobres del mercader';
  histLabel.textContent = 'Tus cartas';
  setVista('compra');
}
function salirCompra(){
  cola = null;
  resetSobre();
  historial = histLibre;
  gracias = true;
  pintarBurbuja();
  setVista('tienda');
}

var T = CONFIG.tienda;
var NOMBRES = {
  aleatorio: ['Pack sorpresa','packs sorpresa','Sorpresa'],
  comun:     ['Sobre común','sobres comunes','Común'],
  oscura:    ['Sobre oscuro','sobres oscuros','Oscura'],
  hechizo:   ['Sobre de hechizos','sobres de hechizos','Hechizo'],
  especial:  ['Sobre especial','sobres especiales','Especial'],
  fenix:     ['Sobre de la Orden del Fénix','sobres de la Orden del Fénix','Orden del Fénix'],
  horrocrux: ['Sobre de Horrocrux','sobres de Horrocrux','Horrocrux'],
  reliquia:  ['Sobre de Reliquias','sobres de Reliquias de la Muerte','Reliquia']
};
var PRODUCTOS = [], PROD = {};
['aleatorio'].concat(ORDEN.filter(function(t){ return porTipo[t].length; })).forEach(function(id){
  var n = NOMBRES[id];
  var p = { id:id, pack: id==='aleatorio' ? 'random' : id, nombre:n[0], de:n[1], corto:n[2],
            color: id==='aleatorio' ? GOLD : TIPOS[id].c,
            sub: id==='aleatorio' ? 'Prueba suerte \u00b7 '+cartas.length+' cartas' : porTipo[id].length+' cartas distintas' };
  PRODUCTOS.push(p); PROD[id]=p;
});
function precioBase(id){ var v=T.precios[id]; return (typeof v==='number' && v>0) ? v : 10; }

/* ---------- fechas ---------- */
var DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function pad(n){ return n<10 ? '0'+n : ''+n; }
function clave(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function deClave(k){ var p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12, 0, 0); }
function sumarDias(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function estaAbierto(d){ return T.diasAbiertos.indexOf(d.getDay())>=0 && T.diasCerrados.indexOf(clave(d))<0; }
function mayus(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fechaLarga(d){ return mayus(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ---------- azar reproducible: las mismas ofertas para todo el mundo cada día ---------- */
function xmur3(str){
  var h=1779033703^str.length, i;
  for(i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return h>>>0; };
}
function mulberry32(a){
  return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}
function rngDe(txt){ return mulberry32(xmur3(txt)()); }

function ofertasDe(key){
  var man = T.manuales && T.manuales[key];
  if(man && man.length){
    return man.filter(function(o){ return o && PROD[o.tipo] && /^(2x1|3x2|rebaja)$/.test(o.tipoOferta); })
              .map(function(o){ return { tipo:o.tipo, tipoOferta:o.tipoOferta, pct:o.pct||30 }; });
  }
  var r = rngDe(T.semilla+'|'+key);
  var n = Math.max(0, Math.min(3, T.ofertasPorDia|0));
  var kinds = ['2x1','3x2','rebaja'], i, j, x;
  for(i=kinds.length-1;i>0;i--){ j=Math.floor(r()*(i+1)); x=kinds[i]; kinds[i]=kinds[j]; kinds[j]=x; }
  var usados = {}, res = [];
  for(i=0;i<n;i++){
    var kind = kinds[i];
    var base = kind==='2x1' ? T.en2x1 : kind==='3x2' ? T.en3x2 : T.enRebaja;
    var pool = base.filter(function(t){ return PROD[t] && !usados[t]; });
    if(!pool.length) continue;
    var tipo = pool[Math.floor(r()*pool.length)];
    usados[tipo] = 1;
    var o = { tipo:tipo, tipoOferta:kind };
    if(kind==='rebaja'){
      var lista = T.rebajas.filter(function(p){ return (tipo==='horrocrux'||tipo==='reliquia') ? p<=T.rebajaMaxCaras : true; });
      if(!lista.length) lista = [T.rebajas[0]];
      o.pct = lista[Math.floor(r()*lista.length)];
    }
    res.push(o);
  }
  return res;
}

/* ---------- precios ---------- */
function calcular(id, q, of){
  var base = precioBase(id), normal = base*q, pagas = normal, unit = base;
  if(of){
    if(of.tipoOferta==='2x1') pagas = Math.ceil(q/2)*base;
    else if(of.tipoOferta==='3x2') pagas = (q-Math.floor(q/3))*base;
    else { unit = Math.max(1, Math.round(base*(1-of.pct/100))); pagas = unit*q; }
  }
  return { normal:normal, pagas:pagas, ahorro:normal-pagas, unit:unit };
}
function etiqueta(o){ return o.tipoOferta==='rebaja' ? '-'+o.pct+' %' : o.tipoOferta; }
function txtOferta(o){
  var p = PROD[o.tipo];
  if(o.tipoOferta==='rebaja') return p.de+' con un '+o.pct+' % de descuento';
  return o.tipoOferta+' en '+p.de;
}
function cortaOferta(o){ return etiqueta(o)+' · '+PROD[o.tipo].corto; }

/* ---------- estado de hoy ---------- */
var hoy = new Date();
try{
  var qf = new URLSearchParams(location.search).get('fecha');   /* ?fecha=2026-10-02 para ver otro día */
  if(qf && /^\d{4}-\d{2}-\d{2}$/.test(qf)) hoy = deClave(qf);
}catch(e){}
var cerrado = !estaAbierto(hoy);
var dia = hoy;
if(cerrado){
  for(var k=1;k<=21;k++){ var d2=sumarDias(hoy,k); if(estaAbierto(d2)){ dia=d2; break; } }
}
var ofertas = ofertasDe(clave(dia));
var ofertaDe = {};
ofertas.forEach(function(o){ ofertaDe[o.tipo]=o; });
var ventas = [];
var gracias = false;

/* ---------- dibujo ---------- */
function monedaSVG(){
  return '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#e6b957" stroke="#a87a1f" stroke-width="1.5"/>'+
         '<circle cx="10" cy="10" r="5.6" fill="none" stroke="#a87a1f" stroke-width="1.2"/><path d="M10 6.4l2.6 4.6H7.4z" fill="#a87a1f"/></svg>';
}
function sobreSVG(c){
  return '<svg class="art" viewBox="0 0 120 88" aria-hidden="true">'+
    '<rect x="4" y="10" width="112" height="74" rx="5" fill="#c9ab72"/>'+
    '<polygon points="4,10 62,52 4,84" fill="#b99b62"/><polygon points="116,10 58,52 116,84" fill="#b39459"/>'+
    '<polygon points="4,84 60,44 116,84" fill="#e0c990"/><polygon points="4,10 116,10 60,56" fill="#a98a52"/>'+
    '<circle cx="60" cy="56" r="12.5" fill="'+c+'" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/>'+
    '<g fill="none" stroke="#1a0f05" stroke-opacity=".65" stroke-width="1.7" stroke-linejoin="round"><path d="M60 47.5 68 63H52z"/><circle cx="60" cy="58.4" r="4.2"/><path d="M60 47.5V63"/></g></svg>';
}

function tarjeta(p, of, feat){
  var q = of ? (of.tipoOferta==='2x1' ? 2 : of.tipoOferta==='3x2' ? 3 : 1) : 1;
  var base = precioBase(p.id);
  var art = document.createElement('article');
  art.className = 'prod'+(feat?' feat':'');
  art.style.setProperty('--c', p.color);
  var unitTxt = '', linea = '';
  if(of){
    var c1 = calcular(p.id,1,of);
    if(of.tipoOferta==='rebaja'){ unitTxt='<s>'+base+'</s> <b>'+c1.unit+'</b>'; linea='Rebajado de '+base+' a '+c1.unit+' puntos'; }
    else { unitTxt='<b>'+base+'</b>'; linea = of.tipoOferta==='2x1' ? 'Compra 2 y paga solo 1' : 'Compra 3 y paga solo 2'; }
  } else { unitTxt='<b>'+base+'</b>'; }
  art.innerHTML =
    (of ? '<span class="badge">'+etiqueta(of)+'</span>' : '')+
    sobreSVG(p.color)+
    '<h3>'+p.nombre+'</h3><div class="sub">'+p.sub+'</div>'+
    '<div class="precio">'+monedaSVG()+unitTxt+'<i>puntos</i></div>'+
    '<div class="oferta-txt">'+(linea||'&nbsp;')+'</div>'+
    '<div class="qty"><button type="button" class="menos" aria-label="Uno menos">−</button><output aria-live="polite">'+q+'</output><button type="button" class="mas" aria-label="Uno más">+</button></div>'+
    '<div class="total"></div>'+
    '<button type="button" class="buy">'+(cerrado?'Cerrado':'Comprar')+'</button>';
  var out = art.querySelector('output'), tot = art.querySelector('.total');
  var menos = art.querySelector('.menos'), mas = art.querySelector('.mas'), buy = art.querySelector('.buy');
  function pinta(){
    var c = calcular(p.id, q, of);
    out.textContent = q;
    tot.innerHTML = 'Pagas <b>'+c.pagas+'</b> puntos'+(c.ahorro>0 ? '<em>¡Ahorras '+c.ahorro+'!</em>' : '');
    menos.disabled = q<=1; mas.disabled = q>=10;
  }
  menos.addEventListener('click', function(){ if(q>1){ q--; pinta(); } });
  mas.addEventListener('click', function(){ if(q<10){ q++; pinta(); } });
  buy.disabled = cerrado;
  buy.addEventListener('click', function(){ abrirConfirmacion(p, q, of); });
  pinta();
  return art;
}

function pintarBurbuja(){
  var el = $('bubble'), txt;
  if(gracias){
    txt = '¡Un placer hacer negocios contigo! Vuelve cuando reúnas más puntos.';
  } else if(cerrado){
    txt = 'Hoy el mercader descansa… Vuelve el '+DIAS[dia.getDay()]+' '+dia.getDate()+' con las ofertas que ves aquí.';
  } else {
    var r = rngDe(T.semilla+'|hola|'+clave(dia));
    var saludos = ['¡Acércate, joven mago!','Psst… tengo algo especial para ti.','¡Bienvenido a mi puesto!','Hoy el mercader está de buen humor.','Mira, mira… mercancía de la buena.'];
    var s = saludos[Math.floor(r()*saludos.length)];
    txt = ofertas.length ? s+' Hoy tengo '+ofertas.map(txtOferta).join(' y ')+'.' : s+' Hoy no hay ofertas, pero mis precios son justos.';
  }
  el.textContent = txt;
}

function pintarTienda(){
  $('fecha').textContent = cerrado ? 'Hoy: '+fechaLarga(hoy)+' · cerrado' : fechaLarga(hoy);
  $('tOfertas').textContent = cerrado ? 'Ofertas del '+DIAS[dia.getDay()]+' '+dia.getDate() : 'Ofertas de hoy';
  pintarBurbuja();

  var of = $('ofertas'); of.innerHTML='';
  if(!ofertas.length){
    var a=document.createElement('p'); a.className='aviso'; a.textContent='Hoy no hay ofertas. ¡Mañana puede haberlas!'; of.appendChild(a);
  }
  ofertas.forEach(function(o){ of.appendChild(tarjeta(PROD[o.tipo], o, true)); });

  var gr = $('grid'); gr.innerHTML='';
  PRODUCTOS.filter(function(p){ return !ofertaDe[p.id]; })
    .sort(function(a,b){ return precioBase(a.id)-precioBase(b.id); })
    .forEach(function(p){ gr.appendChild(tarjeta(p, null, false)); });

  /* semana */
  var sem = $('semana'); sem.innerHTML='';
  var lunes = sumarDias(dia, -((dia.getDay()+6)%7));
  for(var i=0;i<7;i++){
    var d = sumarDias(lunes,i);
    if(T.diasAbiertos.indexOf(d.getDay())<0) continue;
    var box=document.createElement('div'); box.className='dia'+(clave(d)===clave(dia)?' hoy':'');
    var h=document.createElement('h4'); h.textContent=mayus(DIAS[d.getDay()])+' '+d.getDate(); box.appendChild(h);
    var ul=document.createElement('ul');
    if(T.diasCerrados.indexOf(clave(d))>=0){
      var lc=document.createElement('li'); lc.className='cerr'; lc.textContent='Cerrado'; ul.appendChild(lc);
    } else {
      var os=ofertasDe(clave(d));
      if(!os.length){ var ln=document.createElement('li'); ln.className='cerr'; ln.textContent='Sin ofertas'; ul.appendChild(ln); }
      os.forEach(function(o){ var li=document.createElement('li'); li.textContent=cortaOferta(o); ul.appendChild(li); });
    }
    box.appendChild(ul); sem.appendChild(box);
  }
  actualizarCajaBtn();
}

/* ---------- confirmación de compra ---------- */
var mConf=$('mConfirmar'), mCaja=$('mCaja'), pendiente=null;
function abrirConfirmacion(p, q, of){
  var c = calcular(p.id, q, of);
  pendiente = { p:p, q:q, of:of, c:c };
  $('mRes').textContent = q+' × '+p.nombre+(of ? ' · oferta '+etiqueta(of) : '');
  $('mTot').textContent = c.pagas;
  $('mAh').textContent = c.ahorro>0 ? '(ahorras '+c.ahorro+')' : '';
  $('mNota').textContent = 'Descuenta '+c.pagas+' puntos en ClassDojo. Después se abrirán '+q+(q===1?' sobre.':' sobres.');
  $('mQuien').value='';
  mConf.hidden=false; $('mSi').focus();
}
function cerrarModales(){ mConf.hidden=true; mCaja.hidden=true; pendiente=null; }
$('mNo').addEventListener('click', cerrarModales);
mConf.addEventListener('click', function(e){ if(e.target===mConf) cerrarModales(); });
mCaja.addEventListener('click', function(e){ if(e.target===mCaja) cerrarModales(); });
$('mQuien').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); $('mSi').click(); } });
$('mSi').addEventListener('click', function(){
  if(!pendiente) return;
  var v = pendiente;
  ventas.push({ t:new Date(), quien:$('mQuien').value.trim(), nombre:v.p.nombre, q:v.q, pagas:v.c.pagas, of: v.of ? etiqueta(v.of) : '' });
  cerrarModales(); gracias=false; pintarBurbuja(); actualizarCajaBtn();
  iniciarCompra(v.p, v.q);
});

/* ---------- caja ---------- */
function actualizarCajaBtn(){
  var t=0; ventas.forEach(function(v){ t+=v.pagas; });
  $('cajaBtn').textContent = ventas.length ? 'Caja de la sesión · '+t+' puntos' : 'Caja de la sesión';
}
function pintarCaja(){
  var ul=$('cajaLista'); ul.innerHTML=''; var tot=0;
  if(!ventas.length){ var v0=document.createElement('li'); v0.className='vacio'; v0.textContent='Todavía no hay ventas en esta sesión.'; ul.appendChild(v0); }
  ventas.forEach(function(v){
    tot+=v.pagas;
    var li=document.createElement('li');
    li.textContent = hhmm(v.t)+' · '+(v.quien||'Sin nombre')+' · '+v.q+' × '+v.nombre+(v.of?' ('+v.of+')':'')+' · '+v.pagas+' puntos';
    ul.appendChild(li);
  });
  $('cajaTot').textContent = tot+' puntos en '+ventas.length+(ventas.length===1?' venta':' ventas');
}
$('cajaBtn').addEventListener('click', function(){ pintarCaja(); mCaja.hidden=false; $('cCerrar').focus(); });
$('cCerrar').addEventListener('click', cerrarModales);
$('cVaciar').addEventListener('click', function(){ ventas=[]; pintarCaja(); actualizarCajaBtn(); });

/* ---------- pestañas y teclado ---------- */
tabTienda.addEventListener('click', function(){ if(estado!=='busy') setVista('tienda'); });
tabSobres.addEventListener('click', function(){ if(estado!=='busy') setVista('sobres'); });
if(!CONFIG.sobresLibres){ tabSobres.hidden = true; }

window.MERCADER = { elegirTipo:elegirTipo, calcular:calcular, ofertasDe:ofertasDe, clave:clave, precioBase:precioBase };

/* ---------- arranque ---------- */
crearPacks();
document.documentElement.style.setProperty('--seal', GOLD);
if(typeof IMG_HERO!=='undefined'){ $('hero').src = IMG_HERO; }
pintarTienda();
setVista('tienda');
})();

</script>
</body>

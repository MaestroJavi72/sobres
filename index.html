<!DOCTYPE html>
<html lang="es" data-tema="hp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Javificación</title>
<link rel="stylesheet" href="comun/javi.css">
<style>
/* ---------- cabecera ---------- */
.cab{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.cab .marca{flex:1;min-width:0}
.cab h1{font-size:clamp(30px,7vw,80px);line-height:1;overflow-wrap:anywhere}
.cab .lema{font-family:var(--f-sub);color:var(--tinta-suave);font-size:clamp(15px,1.8vw,20px);margin-top:6px;letter-spacing:.06em}
.botones{display:flex;gap:8px}

/* ---------- multiverso ---------- */
.multiTit{margin-top:14px;font-family:var(--f-sub);font-weight:700;font-size:15px;color:var(--tinta-suave);letter-spacing:.04em}
.multiTit span{font-weight:500;opacity:.85}
.multi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 22px}
.mundo{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radio);border:2px dashed var(--panel-borde);
  background:rgba(0,0,0,.18);color:var(--tinta-suave);font-family:var(--f-sub);font-weight:700;font-size:clamp(14px,1.6vw,18px)}
.mundo .ic{font-size:26px;filter:grayscale(.8);opacity:.6}
.mundo small{display:block;font-weight:500;font-size:13px;opacity:.85}
.mundo.ahora{border-style:solid;border-color:var(--acento);background:var(--panel);color:var(--tinta);box-shadow:0 0 0 4px var(--brillo)}
.mundo.ahora .ic{filter:none;opacity:1;animation:flota 3s ease-in-out infinite}
.mundo.ahora::after{content:'AHORA';position:absolute;top:-10px;right:12px;background:var(--acento);color:var(--acento-tinta);font-size:11px;padding:2px 8px;border-radius:8px;letter-spacing:.08em}
@keyframes flota{50%{transform:translateY(-4px) rotate(-6deg)}}
@media (max-width:620px){ .multi{grid-template-columns:1fr} }

/* ---------- módulos ---------- */
.sec{font-family:var(--f-sub);font-weight:700;color:var(--acento-2);font-size:clamp(16px,2vw,21px);letter-spacing:.05em;margin:20px 0 10px;text-transform:uppercase}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:16px 16px 14px;text-decoration:none;color:var(--tinta);
  background:var(--panel);border:2px solid var(--panel-borde);border-radius:var(--radio);box-shadow:0 10px 24px rgba(0,0,0,.25);
  transition:transform .15s, box-shadow .15s, border-color .15s}
a.mod:hover,a.mod:focus-visible{transform:translateY(-3px);border-color:var(--acento);box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 0 3px var(--brillo)}
.mod .ic{font-size:40px;line-height:1}
.mod h3{font-family:var(--f-titulo);text-transform:var(--titulo-transform);color:var(--titulo-color);font-size:clamp(20px,2.3vw,26px);line-height:1.1}
.mod p{color:var(--tinta-suave);font-size:16px;line-height:1.3}
.mod .gr{font-family:var(--f-sub);font-size:13px;font-weight:700;color:var(--acento-2);letter-spacing:.04em}
.mod.pronto{opacity:.55;border-style:dashed;box-shadow:none}
.mod.pronto::after{content:'Próximamente';position:absolute;top:12px;right:12px;font-family:var(--f-sub);font-size:12px;font-weight:700;
  background:rgba(0,0,0,.25);color:var(--tinta-suave);padding:3px 8px;border-radius:8px}
.mod.profe{border-color:var(--acento)}
.bloqueSec[data-tema]{margin:0 -10px;padding:2px 10px 14px;border-radius:calc(var(--radio) + 6px);background:var(--fondo-img),var(--fondo);background-attachment:scroll;background-size:cover}
.bloqueSec[data-tema]{font-family:var(--f-texto);color:var(--tinta)}
.bloqueSec[data-tema="hp"]{background:#0b1a1c;background:linear-gradient(180deg,#0e2a28,#0a1a22)}
.pie{margin-top:28px;text-align:center;color:var(--tinta-suave);font-size:15px}
.pie a{color:var(--acento-2)}
</style>
</head>
<body>
<div class="j-envoltorio">
  <header class="cab">
    <div class="marca">
      <h1 class="j-titulo">Javificación</h1>
      <div class="lema" id="lema">CEIP Arias Montano</div>
    </div>
    <div class="botones">
      <button class="j-icono" id="bPantalla" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
    </div>
  </header>

  <p class="multiTit">Multiverso de Educación Física · 3ºA, 3ºB y 4ºB <span>(4ºA vive siempre en Hogwarts)</span></p>
  <nav class="multi" id="multi" aria-label="Mundos del curso"></nav>

  <main id="modulos"></main>

  <p class="pie" id="pie"></p>
</div>

<script src="comun/javi.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   MÓDULOS DE LA PORTADA
   url: carpeta del módulo · listo:false = «Próximamente»
   profe:true = solo se ve con ?profe
   alumnos:true = también lo ven los alumnos (sin ?profe)
   ============================================================ */
var SECCIONES = [
  { t:'4ºA · Hogwarts', tema:'hp', mods:[
    { ic:'🏰', n:'Hogwarts', d:'Galeones, niveles, personajes y campeones del mes.', g:'4ºA', url:'hogwarts/#hogwarts', profe:true },
    { ic:'🧙', n:'El Mercader', d:'Compra sobres de cartas con tus galeones. Ofertas del día.', g:'4ºA', url:'hogwarts/', alumnos:true },
    { ic:'✉️', n:'Sobres', d:'Abrir sobres de cartas cuando el profe lo decida.', g:'4ºA', url:'hogwarts/#sobres', profe:true },
    { ic:'🃏', n:'Mis cartas', d:'Consulta tus cartas, tus galeones y tu nivel.', g:'4ºA', url:'hogwarts/#mis', alumnos:true },
    { ic:'🚦', n:'El farol del baño', d:'Semáforos de niños y niñas, con registro diario.', g:'4ºA', listo:false },
    { ic:'✖️', n:'Duelo de tablas', d:'Preguntas de tablas por alumno o por mesas.', g:'4ºA', listo:false }
  ]},
  { t:'Educación Física', mods:[
    { ic:'🤸', n:'Gamificación EF', d:'Coevaluación, Compi del día, la clase y el Mercader de EF.', g:'3ºA · 3ºB · 4ºB', url:'ef/' },
    { ic:'🏦', n:'Bóveda de la clase', d:'Autoevaluación de la clase, galeones colectivos y recompensas.', g:'3ºA · 3ºB · 4ºA · 4ºB', url:'boveda/', alumnos:true },
    { ic:'🎲', n:'Herramientas de sesión', d:'Responsable del día, capitanes y semáforo de contenidos para Séneca.', g:'EF', listo:false }
  ]},
  { t:'Todas las clases', mods:[
    { ic:'📋', n:'Sesión y Ruleta', d:'Planifica la sesión por fases. La Ruleta de preguntas da los puntos sola.', g:'Todas', listo:false },
    { ic:'📚', n:'Biblioteca', d:'Materiales y recursos: breakouts, lecturas, fichas…', g:'Todas', listo:false },
    { ic:'🗝️', n:'Panel del profe', d:'Alumnos (altas, bajas, cambios), tema del trimestre y enlaces para Google Sites.', g:'Profe', url:'profe/', profe:true }
  ]}
];

function $(id){ return document.getElementById(id); }
var profe = JAVI.ES_PROFE;

function pintarMundos(){
  var t = JAVI.temaActual(), box = $('multi'); box.innerHTML = '';
  ['hp','vengadores','pokemon'].forEach(function(k){
    var m = JAVI.TEMAS[k], d = document.createElement('div');
    d.className = 'mundo'+(k===t ? ' ahora' : '');
    d.innerHTML = '<span class="ic" aria-hidden="true">'+m.icono+'</span><span><span class="nm"></span><small></small></span>';
    d.querySelector('.nm').textContent = m.n;
    d.querySelector('small').textContent = m.trimestre+'º trimestre · '+m.mundo;
    box.appendChild(d);
  });
  var tm = JAVI.TEMAS[t];
  $('lema').textContent = tm.trimestre+'º trimestre · '+tm.mundo+' · CEIP Arias Montano';
}

function enlace(url){
  var extra = [];
  if(profe) extra.push('profe');
  if(/[?&]prueba/.test(location.search)) extra.push('prueba');
  if(!extra.length) return url;
  var p = url.split('#');
  return p[0]+(p[0].indexOf('?')>=0 ? '&' : '?')+extra.join('&')+(p[1] ? '#'+p[1] : '');
}

function pintarModulos(){
  var main = $('modulos'); main.innerHTML = '';
  SECCIONES.forEach(function(sec){
    var mods = sec.mods.filter(function(m){ return profe ? true : (m.alumnos && m.listo!==false); });
    if(!mods.length) return;
    var caja = document.createElement('section'); caja.className = 'bloqueSec'; if(sec.tema) caja.setAttribute('data-tema', sec.tema);
    var h = document.createElement('h2'); h.className = 'sec'; h.textContent = sec.t; caja.appendChild(h);
    var g = document.createElement('div'); g.className = 'mods';
    mods.forEach(function(m){
      var listo = m.listo!==false && m.url;
      var el = document.createElement(listo ? 'a' : 'div');
      el.className = 'mod'+(listo ? '' : ' pronto')+(m.profe ? ' profe' : '');
      if(listo) el.href = enlace(m.url);
      el.innerHTML = '<span class="ic" aria-hidden="true"></span><h3></h3><p></p><span class="gr"></span>';
      el.querySelector('.ic').textContent = m.ic;
      el.querySelector('h3').textContent = m.n;
      el.querySelector('p').textContent = m.d;
      el.querySelector('.gr').textContent = m.g;
      g.appendChild(el);
    });
    caja.appendChild(g); main.appendChild(caja);
  });
  $('pie').innerHTML = profe ? 'Modo profe. Los alumnos ven esta portada sin <b>?profe</b> (solo El Mercader, Mis cartas y la Bóveda).' : '';
}

$('bPantalla').addEventListener('click', JAVI.pantallaCompleta);
pintarModulos();
pintarMundos();
JAVI.listo(function(){ pintarMundos(); JAVI.avisoPrueba(); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dados de cuentos para recortar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2a2420;font-family:'Andika',sans-serif;color:#2b2116}
.barra{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:#14100d;border-bottom:2px solid #c9a34a}
.barra a,.barra button{font-family:'Cinzel',serif;font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;border:2px solid #c9a34a;background:transparent;color:#f3d27a;text-decoration:none;cursor:pointer}
.barra .prim{background:linear-gradient(180deg,#f3d27a,#c9972e);color:#2b1c05}
.hoja{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:10mm;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:5mm;overflow:hidden}
.hoja h1{font-family:'Cinzel',serif;color:#7a2030;font-size:16pt}
.hoja .ins{font-size:10pt;color:#6b5732}
.redes{display:grid;grid-template-columns:1fr 1fr;gap:6mm 4mm;justify-items:center}
/* desarrollo del cubo en cruz: 4 casillas en columna y 2 a los lados */
.red{display:grid;grid-template-columns:repeat(3,28mm);grid-template-rows:repeat(4,28mm)}
.c{border:1.4px dashed #555;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm;font-size:9.5pt;line-height:1.15;font-weight:700}
.c .ic{font-size:13pt;margin-bottom:1mm}
.c.elige{color:#fff}
.nombre{grid-column:1 / -1;text-align:center;font-family:'Cinzel',serif;font-size:10pt;font-weight:800;margin-bottom:1mm}
@media print{ @page{size:A4;margin:0} body{background:#fff} .barra{display:none} .hoja{margin:0;box-shadow:none;page-break-after:always;break-after:page} .hoja:last-child{page-break-after:auto}
  .c{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
@media (max-width:820px){ .hoja{width:auto;height:auto;margin:10px} .redes{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav class="barra"><a href="i15-dados.html" id="bVolver">← Volver a los dados</a><button class="prim" type="button" onclick="window.print()">🖨️ Imprimir los 5 dados</button></nav>
<div id="hojas"></div>
<script src="dados-datos.js"></script>
<script>
(function(){
/* posiciones de las 6 caras en la cruz (fila, columna) */
var POS = [[1,2],[2,1],[2,2],[2,3],[3,2],[4,2]];
function red(d, i){
  var h = '<div><div class="nombre" style="color:'+d.col+'">Dado '+(i+1)+' · '+d.n+'</div><div class="red">';
  d.caras.forEach(function(t, k){
    var elige = t==='Elige tú';
    h += '<div class="c'+(elige ? ' elige' : '')+'" style="grid-row:'+POS[k][0]+';grid-column:'+POS[k][1]+';border-color:'+d.col+';'+(elige ? 'background:'+d.col : 'background:'+d.col+'14')+'">'+
      '<span class="ic">'+(elige ? '⭐' : d.ic)+'</span>'+t+'</div>';
  });
  return h+'</div></div>';
}
var hojas = [[0,1,2,3],[4]], out = '';
hojas.forEach(function(g, n){
  out += '<section class="hoja"><h1>🎲 Dados de cuentos · Tema 2 '+(n ? '(2/2)' : '(1/2)')+'</h1>'+
    '<p class="ins">Recorta por la línea de puntos, dobla por las aristas y pega con cinta adhesiva. Dados 1-3: planteamiento · dado 4: nudo · dado 5: giro final.</p>'+
    '<div class="redes">'+g.map(function(i){ return red(DADOS[i], i); }).join('')+'</div></section>';
});
document.getElementById('hojas').innerHTML = out;
document.getElementById('bVolver').addEventListener('click', function(e){ try{ if(document.referrer && new URL(document.referrer).origin===location.origin){ e.preventDefault(); history.back(); } }catch(err){} });
})();
</script>
<script src="../comun/barra.js"></script>
</body>
</html>

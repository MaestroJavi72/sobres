<!DOCTYPE html>
<html lang="es" data-tema="hp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordena el cuento</title>
<link rel="stylesheet" href="../../comun/javi.css">
<link rel="stylesheet" href="../comun/actividad.css">
<style>
.titulo{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(22px,3vw,34px);color:#7a2030}
.mesa{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px;width:100%;max-width:1100px}
.frag{font-family:'EB Garamond',Georgia,serif;font-size:clamp(17px,2vw,22px);line-height:1.3;padding:10px 14px;border-radius:14px;background:#fffaf0;border:3px solid #b8934f;
  box-shadow:0 4px 0 rgba(0,0,0,.12);max-width:340px;text-align:left;cursor:grab;touch-action:none}
.frag.elegido{outline:4px solid #f3d27a;outline-offset:2px}
.frag.vuela{position:fixed;z-index:50;pointer-events:none;transform:rotate(-2deg);box-shadow:0 14px 26px rgba(0,0,0,.35)}
.frag.fantasma{opacity:.3}
.cajas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:1100px}
@media (max-width:820px){ .cajas{grid-template-columns:1fr} }
.parte{border-radius:18px;border:3px dashed var(--col);background:rgba(255,255,255,.5);padding:10px;min-height:170px;display:flex;flex-direction:column;gap:8px;transition:transform .15s, box-shadow .15s}
.parte.encima{transform:scale(1.02);box-shadow:0 0 0 5px var(--col)}
.parte h3{font-family:'Cinzel',serif;color:var(--col);font-size:clamp(18px,2.2vw,24px)}
.parte .q{font-size:14px;color:#6b5732}
.parte .frag{cursor:default;border-color:var(--col);background:#fff;max-width:none}
.cuento{max-width:900px;text-align:left;font-size:clamp(18px,2.2vw,24px);line-height:1.5}
.cuento p{margin:6px 0}
.cuento b{font-family:'Cinzel',serif;color:#7a2030;font-size:.8em}
</style>
</head>
<body>
<div class="j-envoltorio">
  <header class="cab">
    <h1 class="j-titulo">📚 Ordena el cuento<span class="sub">I-14 · Los cuentos · Tema 2 de Lengua</span></h1>
    <a class="volver" href="../?id=tema2-lengua-4a" data-volver="../?id=tema2-lengua-4a">← Volver</a>
    <button class="j-icono" id="bSonido" type="button" aria-label="Sonido">🔊</button>
    <button class="j-icono" id="bPantalla" type="button" aria-label="Pantalla completa">⛶</button>
  </header>
  <section class="escena" id="escena"></section>
</div>
<script src="../../comun/javi.js"></script>
<script src="../comun/actividad.js"></script>
<script>
(function(){
'use strict';
/* CUENTOS CORTOS (escritos para la actividad): p = planteamiento, n = nudo, d = desenlace */
var CUENTOS = [
  { t:'El fósil brillante', p:['Lía era una niña que vivía junto a una cantera de Algeciras.','Cada tarde paseaba con su perro buscando piedras curiosas.'],
    n:['Un día encontró un fósil que brillaba y empezó a temblar.','De repente, un hombre intentó quitárselo para venderlo.'],
    d:['Lía llamó a una paleontóloga, que llevó el fósil al museo.','Desde entonces, Lía va cada domingo a visitarlo.'] },
  { t:'Ugo y el mamut', p:['Hace miles de años, Ugo vivía con su tribu en una cueva.','Le encantaba pintar animales en las paredes.'],
    n:['Una noche de tormenta, un mamut bebé se perdió cerca de la cueva.','Estaba asustado y no sabía volver con su manada.'],
    d:['Ugo lo guio con una antorcha hasta el valle, donde lo esperaba su madre.','Al día siguiente, Ugo pintó un mamut sonriente en la cueva.'] },
  { t:'La varita de hueso', p:['En Hogwarts, Nora era la alumna más curiosa de primer año.','Le gustaba leer libros sobre dinosaurios en la biblioteca.'],
    n:['Un día encontró una varita de hueso escondida en un libro.','Al usarla, apareció un dinosaurio diminuto en el Gran Comedor.'],
    d:['Con la ayuda de sus amigos, Nora lo devolvió al libro con un hechizo.','Desde ese día, cuida la varita como su mayor tesoro.'] }
];
var PARTES = { p:{ n:'Planteamiento', q:'¿Quién? ¿Dónde? ¿Cuándo?', col:'#2f9a5a' }, n:{ n:'Nudo', q:'¿Qué problema aparece?', col:'#d0473f' }, d:{ n:'Desenlace', q:'¿Cómo se resuelve?', col:'#3a6fd0' } };
var $ = ACT.$, orden = [], c = 0, quedan = [], puntos = 0, total = 0, fallados = {}, elegido = null, arrastre = null;

function empezar(){ orden = ACT.mezclar(CUENTOS); c = 0; puntos = 0; total = 0; pintar(); }
function pintar(){
  var cu = orden[c]; fallados = {}; elegido = null;
  quedan = ACT.mezclar([].concat(cu.p.map(function(x){ return { t:x, k:'p' }; }), cu.n.map(function(x){ return { t:x, k:'n' }; }), cu.d.map(function(x){ return { t:x, k:'d' }; })));
  total += quedan.length;
  $('escena').innerHTML =
    '<div class="barraSup"><span>Cuento '+(c+1)+' de '+orden.length+'</span><div class="progreso"><i style="width:'+(c/orden.length*100)+'%"></i></div><span>⭐ '+puntos+'</span></div>'+
    '<div class="titulo">«'+ACT.esc(cu.t)+'»</div>'+
    '<p class="instr">Arrastra cada trozo a su parte del cuento (o toca el trozo y después la parte).</p>'+
    '<div class="mesa" id="mesa"></div><div class="mensaje" id="msg"></div><div class="cajas" id="cajas"></div>';
  ['p','n','d'].forEach(function(k){
    var d = document.createElement('div'); d.className = 'parte'; d.dataset.k = k; d.style.setProperty('--col', PARTES[k].col);
    d.innerHTML = '<h3>'+PARTES[k].n+'</h3><span class="q">'+PARTES[k].q+'</span>';
    d.addEventListener('click', function(){ if(elegido) soltarEn(elegido, k); });
    $('cajas').appendChild(d);
  });
  pintarMesa();
}
function pintarMesa(){
  var m = $('mesa'); m.innerHTML = '';
  quedan.forEach(function(x){
    var f = document.createElement('div'); f.className = 'frag'; f.textContent = x.t; f._x = x; f.tabIndex = 0;
    f.addEventListener('pointerdown', agarrar);
    f.addEventListener('keydown', function(e){ if(e.key==='Enter'){ elegir(f); } });
    m.appendChild(f);
  });
}
function elegir(f){ if(elegido) elegido.classList.remove('elegido'); elegido = f; f.classList.add('elegido'); ACT.SON.tic(); }
function agarrar(e){
  var f = e.currentTarget, r = f.getBoundingClientRect();
  arrastre = { f:f, x0:e.clientX, y0:e.clientY, dx:e.clientX-r.left, dy:e.clientY-r.top, movido:false };
  try{ f.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener('pointermove', mover); document.addEventListener('pointerup', soltar);
}
function mover(e){
  var a = arrastre; if(!a) return;
  if(!a.movido && Math.hypot(e.clientX-a.x0, e.clientY-a.y0) < 8) return;
  if(!a.movido){ a.movido = true; a.c = a.f.cloneNode(true); a.c.classList.add('vuela'); a.c.style.width = a.f.offsetWidth+'px'; document.body.appendChild(a.c); a.f.classList.add('fantasma'); }
  a.c.style.left = (e.clientX-a.dx)+'px'; a.c.style.top = (e.clientY-a.dy)+'px';
  var p = parteEn(e.clientX, e.clientY);
  Array.prototype.forEach.call(document.querySelectorAll('.parte'), function(x){ x.classList.toggle('encima', x===p); });
}
function soltar(e){
  var a = arrastre; arrastre = null; document.removeEventListener('pointermove', mover); document.removeEventListener('pointerup', soltar); if(!a) return;
  if(a.c) a.c.remove(); a.f.classList.remove('fantasma');
  Array.prototype.forEach.call(document.querySelectorAll('.parte'), function(x){ x.classList.remove('encima'); });
  if(!a.movido){ elegir(a.f); return; }
  var p = parteEn(e.clientX, e.clientY); if(p) soltarEn(a.f, p.dataset.k);
}
function parteEn(x, y){ var r = null; Array.prototype.forEach.call(document.querySelectorAll('.parte'), function(p){ var b = p.getBoundingClientRect(); if(x>=b.left && x<=b.right && y>=b.top && y<=b.bottom) r = p; }); return r; }
function soltarEn(f, k){
  var x = f._x, m = $('msg'); if(elegido){ elegido.classList.remove('elegido'); elegido = null; }
  if(x.k===k){
    if(!fallados[x.t]) puntos++;
    quedan.splice(quedan.indexOf(x), 1);
    var d = document.createElement('div'); d.className = 'frag aparece'; d.textContent = x.t;
    document.querySelector('.parte[data-k="'+k+'"]').appendChild(d);
    m.className = 'mensaje bien'; m.textContent = '¡Bien! Va en el '+PARTES[k].n.toLowerCase()+'.'; ACT.SON.acierto();
    pintarMesa(); document.querySelector('.barraSup span:last-child').textContent = '⭐ '+puntos;
    if(!quedan.length) setTimeout(completo, 700);
  } else {
    fallados[x.t] = true; f.classList.remove('temblor'); void f.offsetWidth; f.classList.add('temblor'); ACT.SON.fallo();
    m.className = 'mensaje mal'; m.textContent = 'Ahí no. Pregúntate: ¿presenta, complica o resuelve?';
  }
}
function completo(){
  var cu = orden[c];
  $('escena').innerHTML = '<div class="titulo">📖 «'+ACT.esc(cu.t)+'»</div><div class="cuento">'+
    '<p><b>PLANTEAMIENTO.</b> '+cu.p.map(ACT.esc).join(' ')+'</p><p><b>NUDO.</b> '+cu.n.map(ACT.esc).join(' ')+'</p><p><b>DESENLACE.</b> '+cu.d.map(ACT.esc).join(' ')+'</p></div>'+
    '<div class="botones"><button class="gran sec" id="bLeer" type="button">🔊 Leer el cuento</button><button class="gran" id="bSig" type="button">'+(c+1<orden.length ? '➡ Siguiente cuento' : '🏁 Ver resultado')+'</button></div>';
  $('bLeer').addEventListener('click', function(){ ACT.voz(cu.t+'. '+cu.p.join(' ')+' '+cu.n.join(' ')+' '+cu.d.join(' ')); });
  $('bSig').addEventListener('click', function(){ if(window.speechSynthesis) speechSynthesis.cancel(); c++; if(c < orden.length) pintar(); else fin(); });
  ACT.SON.magia();
}
function fin(){ ACT.final($('escena'), { titulo:'🏁 ¡Cuentos ordenados!', puntos:puntos, total:total, detalle:'trozos colocados a la primera', textoRepetir:'Jugar otra vez', repetir:empezar }); }
empezar();
ACT.iniciar('tema2-lengua-4a');
})();
</script>
<script src="../comun/barra.js"></script>
</body>
</html>

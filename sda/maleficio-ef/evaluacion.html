<!DOCTYPE html>
<html lang="es" data-tema="hp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluación del Maleficio</title>
<link rel="stylesheet" href="../../comun/javi.css">
<style>
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cab h1{flex:1 1 240px;min-width:0;font-size:clamp(26px,4.5vw,46px);line-height:1.05}
.cab .sub{display:block;font-family:var(--f-sub);font-size:15px;color:var(--acento-2);text-shadow:none;margin-top:4px}
.volver{font-family:var(--f-sub);font-weight:700;font-size:16px;text-decoration:none;padding:9px 16px;border-radius:999px;background:linear-gradient(180deg,#f3d27a,#c9972e);color:#2b1c05;border:2px solid #fff1b8}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-family:var(--f-sub);color:var(--tinta-suave)}
.pestanas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pestanas button{font-family:var(--f-sub);font-weight:700;font-size:17px;padding:9px 16px;border-radius:12px;border:2px solid var(--panel-borde);background:var(--panel);color:var(--tinta);cursor:pointer}
.pestanas button[aria-selected="true"]{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}
[hidden]{display:none!important}
.estado{font-size:15px;color:var(--tinta-suave)}
.btn{font-family:var(--f-sub);font-weight:800;font-size:18px;padding:11px 20px;border-radius:14px;border:2px solid var(--acento);background:var(--acento);color:var(--acento-tinta);cursor:pointer}
.btn.sec{background:rgba(0,0,0,.25);color:var(--tinta)}
.btn:disabled{opacity:.4;cursor:default}
.mini{font-size:15px;padding:7px 12px;border-radius:10px;border:1px solid var(--panel-borde);background:rgba(0,0,0,.15);color:var(--tinta);cursor:pointer}
.mini[aria-pressed="true"]{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:800px){ .dos{grid-template-columns:1fr} }
h2.t{font-family:var(--f-sub);color:var(--titulo-color);font-size:clamp(20px,2.6vw,26px);margin-bottom:8px}

/* sombrero */
.terc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.terc .j-panel{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sombrero{font-size:clamp(70px,12vw,120px);line-height:1}
.sombrero.piensa{animation:piensa .35s infinite alternate}
@keyframes piensa{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.05)}}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips span{font-size:14px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--panel-borde)}
.chips span.ok{border-color:#5fe08a;color:#a8f0bd}

/* observar */
.nombres{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.nombres button{font-family:var(--f-sub);font-weight:700;font-size:17px;padding:11px 8px;border-radius:12px;border:2px solid var(--panel-borde);background:rgba(0,0,0,.2);color:var(--tinta);cursor:pointer}
.nombres button.toca{border-color:var(--acento)}
.nombres button.hecho{background:rgba(47,191,85,.25);border-color:#2fbf55}
.nombres button small{display:block;font-weight:400;font-size:12px;opacity:.85}
.rub{display:flex;flex-direction:column;gap:14px}
.crit h3{font-family:var(--f-sub);color:var(--acento-2);font-size:19px}
.crit .txt{font-size:14px;color:var(--tinta-suave);margin:2px 0 8px}
.niveles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:820px){ .niveles{grid-template-columns:1fr 1fr} }
.niv{text-align:left;font:inherit;font-size:14.5px;line-height:1.3;padding:10px;border-radius:12px;border:2px solid var(--c);background:rgba(0,0,0,.2);color:var(--tinta);cursor:pointer;display:flex;flex-direction:column;gap:5px}
.niv b{font-family:var(--f-sub);color:var(--c);font-size:15px;filter:brightness(1.6)}
.niv.sel{background:var(--c);color:#fff}
.niv.sel b{color:#fff;filter:none}
.notasN{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.notasN button{width:48px;height:44px;border-radius:10px;border:2px solid var(--panel-borde);background:rgba(0,0,0,.2);color:var(--tinta);font:800 19px var(--f-sub);cursor:pointer}
.notasN button.sel{background:var(--acento);color:var(--acento-tinta);border-color:var(--acento)}
textarea{width:100%;min-height:60px;font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--panel-borde);background:rgba(0,0,0,.2);color:var(--tinta)}

/* autoevaluación */
.codigoGrande{font-family:var(--f-titulo);font-size:clamp(54px,10vw,110px);letter-spacing:.15em;color:var(--acento);text-align:center}
.frases{display:flex;flex-direction:column;gap:6px}
.frases .f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.18)}
.frases .f span{flex:1;min-width:200px;font-size:15px}
.caras{display:flex;gap:4px}
.caras button{font-size:24px;width:46px;height:42px;border-radius:10px;border:2px solid transparent;background:rgba(0,0,0,.2);cursor:pointer}
.caras button.sel{border-color:var(--acento);background:rgba(255,255,255,.2)}
select{font-size:17px;padding:8px 10px;border-radius:10px;border:1px solid var(--panel-borde);background:rgba(0,0,0,.25);color:var(--tinta);max-width:100%}
select option{color:#111}

/* notas */
table.notas{width:100%;border-collapse:collapse;font-size:15px}
table.notas th{font-family:var(--f-sub);color:var(--acento-2);padding:6px 4px;border-bottom:2px solid var(--panel-borde);text-align:center;font-size:14px}
table.notas th:first-child,table.notas td:first-child{text-align:left}
table.notas td{padding:6px 4px;border-bottom:1px solid var(--panel-borde);text-align:center}
table.notas td.fin{font-weight:800}
table.notas .sep{border-left:2px solid var(--panel-borde)}
.n-baja{color:#ffb0a8}.n-alta{color:#8fe3a6}

/* modo alumno */
body.alumno .solo-profe{display:none!important}
.paso{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.paso h2{font-family:var(--f-sub);color:var(--titulo-color);font-size:clamp(22px,3vw,32px)}
.paso input{font-size:28px;text-align:center;letter-spacing:.2em;padding:10px;border-radius:12px;border:2px solid var(--panel-borde);background:rgba(0,0,0,.25);color:var(--tinta)}
.fraseA{font-size:clamp(26px,4vw,44px);line-height:1.25;font-family:var(--f-texto)}
.carasA{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){ .carasA{grid-template-columns:1fr 1fr} }
.carasA button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:18px;border:3px solid var(--c);background:rgba(0,0,0,.25);color:var(--tinta);cursor:pointer;font:700 clamp(17px,2.2vw,22px) var(--f-sub)}
.carasA button span{font-size:clamp(54px,9vw,84px);line-height:1}
.carasA button:active{background:var(--c)}
.err{color:#ffb0a8;font-weight:700;min-height:1.4em}
.dianaFin svg{max-width:100%;height:auto;background:#fffaf0;border-radius:50%;padding:6px}
</style>
</head>
<body>
<div class="j-envoltorio">
  <header class="cab">
    <h1 class="j-titulo">🎩 Evaluación del Maleficio<span class="sub" id="sub">Heteroevaluación (sesiones 5-7) · Autoevaluación (sesión 8) · Notas para Séneca</span></h1>
    <a class="volver" href="../?id=maleficio-ef" data-volver="../?id=maleficio-ef">← Volver</a>
    <button class="j-icono" id="bPantalla" type="button" aria-label="Pantalla completa">⛶</button>
  </header>
  <div class="barra solo-profe">Clase: <span id="clases"></span><span style="flex:1"></span><button class="mini" id="bLeer" type="button">🔄 Leer la Hoja</button></div>
  <nav class="pestanas solo-profe" role="tablist">
    <button type="button" role="tab" data-v="sombrero" aria-selected="true">🎩 Sombrero</button>
    <button type="button" role="tab" data-v="observar" aria-selected="false">👁️ Observar (rúbrica)</button>
    <button type="button" role="tab" data-v="auto" aria-selected="false">🎯 Diana del Pensadero</button>
    <button type="button" role="tab" data-v="notas" aria-selected="false">📊 Notas para Séneca</button>
  </nav>
  <section class="vista" id="v-sombrero"></section>
  <section class="vista" id="v-observar" hidden></section>
  <section class="vista" id="v-auto" hidden></section>
  <section class="vista" id="v-notas" hidden></section>
  <section class="vista" id="v-alumno" hidden><div class="j-panel" id="aCaja"></div></section>
</div>

<script src="../../comun/javi.js"></script>
<script src="datos.js"></script>
<script src="comun.js"></script>
<script>
(function(){
'use strict';
var M = MALEFICIO, $ = MAL.$, esc = MAL.esc, G = null, VISTA = 'sombrero', CR = ['3.1','3.2','3.3'];
var ALUMNO = /[?&]alumno\b/.test(location.search), SES = ['S5','S6','S7'];
function nombres(){ var r = JAVI.grupo(G); return r ? r.nombres : []; }
function cerrado(caja, txt){
  if(JAVI.claseAbierta(G)) return false;
  caja.innerHTML = '<div class="j-panel" style="text-align:center"><p class="estado" style="margin-bottom:10px">'+txt+'</p><button class="btn" type="button" data-abrir>🔒 Abrir '+esc(G)+' (código de la clase)</button></div>';
  caja.querySelector('[data-abrir]').addEventListener('click', function(){ JAVI.protegerClase(G, { alAbrir:pintar }); });
  return true;
}

/* ============ 🎩 SOMBRERO: un tercio al azar por sesión ============ */
var verTercio = {};
function pendientes(E, sin){ var usados = {}; Object.keys(E.terc).forEach(function(s){ if(s!==sin) E.terc[s].forEach(function(n){ usados[n] = 1; }); }); return nombres().filter(function(n){ return !usados[n]; }); }
function pintarSombrero(){
  var c = $('v-sombrero'); if(cerrado(c, 'Para que el Sombrero elija, abre la clase.')) return;
  var E = MAL.evaluacion(G);
  c.innerHTML = '<p class="estado" style="margin-bottom:10px">Cada sesión de Aplicación, el Sombrero elige al azar a un tercio de la clase entre quienes aún no han salido. Los nombres quedan ocultos para que nadie sepa a quién observas: míralos en tu tablet o en 👁️ Observar.</p><div class="terc">'+
    SES.map(function(s){
      var l = E.terc[s], n = +s.slice(1), obs = l ? l.filter(function(x){ return E.obs[x] && E.obs[x][s]; }).length : 0;
      return '<div class="j-panel"><h2 class="t">Sesión '+n+'</h2><div class="sombrero" id="som'+s+'">🎩</div>'+
        (l ? '<div><b>'+l.length+'</b> alumnos elegidos · observados '+obs+'</div>'+(verTercio[s] ? '<div class="chips">'+l.map(function(x){ return '<span class="'+(E.obs[x] && E.obs[x][s] ? 'ok' : '')+'">'+esc(x)+'</span>'; }).join('')+'</div>' : '')+
             '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><button class="mini" type="button" data-ver="'+s+'">'+(verTercio[s] ? '🙈 Ocultar' : '👁️ Ver nombres')+'</button><button class="mini" type="button" data-obs="'+s+'">✏️ Observar</button><button class="mini" type="button" data-sorteo="'+s+'">🔁 Rehacer</button></div>'
           : '<button class="btn" type="button" data-sorteo="'+s+'">🎩 ¡Que elija el Sombrero!</button><div class="estado">Quedan '+pendientes(E, s).length+' sin tercio</div>')+'</div>';
    }).join('')+'</div>';
}
function sortear(s){
  var E = MAL.evaluacion(G);
  if(E.terc[s] && !confirm('¿Volver a sortear el tercio de la sesión '+s.slice(1)+'?')) return;
  if(!MAL.conLlave('Para guardar el sorteo del Sombrero, escribe tu código.')) return;
  var pend = pendientes(E, s), resto = SES.filter(function(x){ return x===s || !E.terc[x]; }).length;
  var cuantos = s==='S7' || resto<=1 ? pend.length : Math.ceil(pend.length/resto);
  var l = pend.slice().sort(function(){ return JAVI.util.rnd()-.5; }).slice(0, cuantos);
  var h = $('som'+s); if(h){ h.classList.add('piensa'); }
  MAL.sonar([392,523,659,784], 'triangle', 0.25);
  setTimeout(function(){
    JAVI.escribir({ alumno:MAL.TAG(G), accion:'MalTercio', cartaId:s, tipo:l.length+' alumnos', carta:JSON.stringify({ l:l }) });
    MAL.sonar([523,659,784,1046], 'triangle'); verTercio[s] = false; pintarSombrero();
    MAL.aviso('¡El Sombrero ha elegido a '+l.length+' magos para la sesión '+s.slice(1)+'!');
  }, 1800);
}
$('v-sombrero').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.sorteo) sortear(b.dataset.sorteo);
  if(b.dataset.ver){ verTercio[b.dataset.ver] = !verTercio[b.dataset.ver]; pintarSombrero(); }
  if(b.dataset.obs){ obsSes = b.dataset.obs; verVista('observar'); }
});

/* ============ 👁️ OBSERVAR: rúbrica por alumno ============ */
var obsSes = 'S5', obsN = null, borr = null, verOtros = false;
function pintarObservar(){
  var c = $('v-observar'); if(cerrado(c, 'Para observar, abre la clase.')) return;
  var E = MAL.evaluacion(G), l = E.terc[obsSes] || [], todos = nombres(), L = MAL.letra(G);
  var h = '<div class="barra">Sesión: '+['S5','S6','S7','S8'].map(function(s){ return '<button class="mini" type="button" data-ses="'+s+'" aria-pressed="'+(s===obsSes)+'">'+s.slice(1)+(s==='S8' ? ' (recuperar)' : '')+'</button>'; }).join(' ')+'</div>';
  if(!obsN){
    var otros = todos.filter(function(n){ return l.indexOf(n)<0; });
    function boton(n, toca){ var o = E.obs[n] && E.obs[n][obsSes]; return '<button type="button" data-n="'+esc(n)+'" class="'+(toca ? 'toca' : '')+(o ? ' hecho' : '')+'">'+esc(n)+'<small>'+(o ? CR.map(function(k){ return o.n[k]!=null ? o.n[k] : '—'; }).join(' · ') : (toca ? 'le toca hoy' : ''))+'</small></button>'; }
    var sinNadie = todos.filter(function(n){ return !E.obs[n]; });
    h += '<div class="j-panel">'+(l.length ? '<h2 class="t">🎩 Le toca a este tercio ('+l.length+')</h2><div class="nombres">'+l.map(function(n){ return boton(n, true); }).join('')+'</div>'
        : '<p class="estado">'+(obsSes==='S8' ? 'Sesión 8: observa aquí a quien no pudiste observar.' : 'El Sombrero aún no ha elegido el tercio de esta sesión. Puedes observar a cualquiera igualmente.')+'</p>')+
      '<p style="margin:12px 0 6px"><button class="mini" type="button" data-otros aria-pressed="'+verOtros+'">'+(verOtros || !l.length ? '▾' : '▸')+' El resto de la clase</button></p>'+
      ((verOtros || !l.length) ? '<div class="nombres">'+otros.map(function(n){ return boton(n, false); }).join('')+'</div>' : '')+
      '<p class="estado" style="margin-top:10px">Sin ninguna observación todavía: '+(sinNadie.length ? sinNadie.map(esc).join(', ') : 'nadie ✔')+'</p></div>';
  } else {
    h += '<div class="j-panel rub"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="mini" type="button" data-volverL>‹ Lista</button><h2 class="t" style="margin:0;flex:1">👁️ '+esc(obsN)+' · sesión '+obsSes.slice(1)+'</h2></div>'+
      CR.map(function(k){
        var v = borr.n[k], niv = v==null ? -1 : M.niveles.findIndex(function(x){ return x.notas.indexOf(+v)>=0; });
        return '<div class="crit"><h3>'+M.crit[k].ic+' '+k+'.'+L+' · '+esc(M.crit[k].corto)+'</h3><div class="txt">'+esc(M.crit[k][L])+'</div><div class="niveles">'+
          M.niveles.map(function(nv, i){ return '<button type="button" class="niv'+(i===niv ? ' sel' : '')+'" style="--c:'+nv.col+'" data-k="'+k+'" data-niv="'+i+'"><b>'+nv.n+' ('+nv.r+')</b>'+esc(M.rubrica[k][L][i])+'</button>'; }).join('')+'</div>'+
          (niv>=0 ? '<div class="notasN">'+M.niveles[niv].notas.map(function(x){ return '<button type="button" data-k="'+k+'" data-nota="'+x+'" class="'+(+v===x ? 'sel' : '')+'">'+x+'</button>'; }).join('')+'</div>' : '')+'</div>';
      }).join('')+
      '<label class="estado">Observaciones (opcional)<textarea id="oTxt" maxlength="300">'+esc(borr.o||'')+'</textarea></label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-guardar>💾 Guardar</button><button class="btn sec" type="button" data-volverL>Cancelar</button></div></div>';
  }
  c.innerHTML = h;
}
$('v-observar').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.ses){ obsSes = b.dataset.ses; obsN = null; pintarObservar(); return; }
  if(b.hasAttribute('data-otros')){ verOtros = !verOtros; pintarObservar(); return; }
  if(b.dataset.n){
    obsN = b.dataset.n; var E = MAL.evaluacion(G), o = E.obs[obsN] && E.obs[obsN][obsSes];
    borr = o ? { n:JSON.parse(JSON.stringify(o.n)), o:o.o||'' } : { n:{}, o:'' }; pintarObservar(); window.scrollTo(0, 0); return;
  }
  if(b.hasAttribute('data-volverL')){ obsN = null; pintarObservar(); return; }
  if(b.dataset.niv!=null){ var nv = M.niveles[+b.dataset.niv]; borr.o = ($('oTxt')||{}).value || borr.o; borr.n[b.dataset.k] = nv.notas.length===2 ? nv.notas[0] : nv.notas[Math.floor(nv.notas.length/2)]; pintarObservar(); return; }
  if(b.dataset.nota){ borr.o = ($('oTxt')||{}).value || borr.o; borr.n[b.dataset.k] = +b.dataset.nota; pintarObservar(); return; }
  if(b.hasAttribute('data-guardar')){
    borr.o = $('oTxt').value.trim();
    var falta = CR.filter(function(k){ return borr.n[k]==null; });
    if(falta.length && !confirm('Falta la nota de '+falta.join(', ')+'. ¿Guardar igualmente?')) return;
    if(!MAL.conLlave('Para guardar la observación, escribe tu código.')) return;
    JAVI.escribir({ alumno:MAL.TAG(G), accion:'MalObs', cartaId:obsSes, tipo:obsN, carta:JSON.stringify(borr) });
    MAL.aviso('Guardado: '+obsN); obsN = null; pintarObservar();
  }
});

/* ============ 🎯 DIANA: tablets (código del día) o a mano desde el papel ============ */
var mano = { n:'', r:[0,0,0,0,0,0] };
function urlAlumno(){ return location.href.split('#')[0].split('?')[0]+'?alumno'; }
function pintarAuto(){
  var c = $('v-auto'), E = MAL.evaluacion(G), ns = JAVI.claseAbierta(G) ? nombres() : [], hechos = Object.keys(E.auto);
  c.innerHTML = '<div class="dos"><div class="j-panel"><h2 class="t">📱 En las tablets</h2><ol style="margin:6px 0 0 22px;font-size:17px;line-height:1.5"><li>En cada tablet: <b>'+esc(urlAlumno())+'</b></li><li>Clase <b>'+esc(G)+'</b> (código de clase) y su nombre.</li><li>Escriben el <b>código de la diana</b> y responden 6 frases con caritas.</li></ol>'+
      '<div style="text-align:center;margin-top:10px"><div class="estado">Código de hoy para '+esc(G)+'</div><div class="codigoGrande" id="cDia">····</div><button class="btn sec" type="button" id="verCod">👁️ Mostrar el código</button></div>'+
      '<p class="estado" style="margin-top:8px">Se guarda sin tu código, pero solo con el de hoy. Las respuestas salen aquí cuando se actualiza la Hoja (unos minutos).</p></div>'+
    '<div class="j-panel"><h2 class="t">✍️ Pasar una diana de papel</h2>'+
      (ns.length ? '<select id="mNom"><option value="">¿Quién?</option>'+ns.map(function(n){ return '<option'+(n===mano.n ? ' selected' : '')+'>'+esc(n)+'</option>'; }).join('')+'</select>'+
        '<div class="frases" style="margin-top:8px">'+M.diana.map(function(d, i){ return '<div class="f"><span>'+(i+1)+'. '+esc(d.t)+'</span><div class="caras">'+M.caras.map(function(k){ return '<button type="button" data-f="'+i+'" data-v="'+k.v+'" class="'+(mano.r[i]===k.v ? 'sel' : '')+'" title="'+k.t+'">'+k.ic+'</button>'; }).join('')+'</div></div>'; }).join('')+'</div>'+
        '<p style="margin-top:8px"><button class="btn" type="button" id="mGuardar">💾 Guardar la diana</button></p>'
      : '<button class="btn" type="button" data-abrir2>🔒 Abrir '+esc(G)+'</button>')+'</div></div>'+
    '<div class="j-panel" style="margin-top:12px"><h2 class="t">Han hecho la diana: '+hechos.length+(ns.length ? ' de '+ns.length : '')+'</h2>'+(ns.length ? '<div class="chips" style="justify-content:flex-start">'+ns.map(function(n){ return '<span class="'+(E.auto[n] ? 'ok' : '')+'">'+(E.auto[n] ? '✔ ' : '')+esc(n)+'</span>'; }).join('')+'</div>' : '')+'</div>';
}
$('v-auto').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id==='verCod'){ if(!MAL.conLlave('El código de la diana solo lo ve el profe. Escribe tu código.')) return; MAL.codigoDia(G).then(function(s){ $('cDia').textContent = s || '—'; if(!s) MAL.aviso('Aún no has creado tu código en el Panel del profe.'); }); }
  if(b.hasAttribute('data-abrir2')) JAVI.protegerClase(G, { alAbrir:pintarAuto });
  if(b.dataset.f!=null){ mano.r[+b.dataset.f] = +b.dataset.v; pintarAuto(); }
  if(b.id==='mGuardar'){
    if(!mano.n){ MAL.aviso('Elige primero de quién es la diana.'); return; }
    if(mano.r.indexOf(0)>=0){ MAL.aviso('Falta alguna frase por marcar.'); return; }
    if(!MAL.conLlave('Para guardar la diana, escribe tu código.')) return;
    JAVI.escribir({ alumno:MAL.TAG(G), accion:'MalAuto', cartaId:'auto', tipo:mano.n, carta:JSON.stringify({ r:mano.r, mano:1 }) });
    MAL.aviso('Diana de '+mano.n+' guardada.'); mano = { n:'', r:[0,0,0,0,0,0] }; pintarAuto();
  }
});
$('v-auto').addEventListener('change', function(e){ if(e.target.id==='mNom'){ mano.n = e.target.value; var a = MAL.evaluacion(G).auto[mano.n]; mano.r = a ? a.r.slice() : [0,0,0,0,0,0]; pintarAuto(); } });

/* ============ 📊 NOTAS PARA SÉNECA ============ */
function tabla(){
  var E = MAL.evaluacion(G), ns = nombres().concat(Object.keys(E.obs).concat(Object.keys(E.auto)).filter(function(n, i, a){ return nombres().indexOf(n)<0 && a.indexOf(n)===i; }));
  return ns.map(function(n){
    var fila = { n:n, c:{} }, s = 0, k = 0;
    CR.forEach(function(c){ var h = MAL.notaH(E.obs[n], c), a = MAL.notaA(E.auto[n], c), f = MAL.notaFinal(h, a); fila.c[c] = { h:h, a:a, f:f }; if(f!=null){ s += f; k++; } });
    fila.ce = k ? s/k : null; fila.obs = Object.keys(E.obs[n]||{}).map(function(x){ return E.obs[n][x].o; }).filter(Boolean).join(' · ');
    return fila;
  });
}
function cls(x){ return x==null ? '' : x<5 ? 'n-baja' : x>=8 ? 'n-alta' : ''; }
function pintarNotas(){
  var c = $('v-notas'); if(cerrado(c, 'Para ver las notas, abre la clase.')) return;
  var t = tabla(), L = MAL.letra(G);
  c.innerHTML = '<div class="j-panel"><div class="barra"><span>Nota del criterio = <b>'+M.pesos.hetero+' %</b> rúbrica (H) + <b>'+M.pesos.auto+' %</b> diana (A). Diana: media de sus 2 frases × 2,5. CE3 = media de los 3 criterios.</span><span style="flex:1"></span><button class="mini" type="button" id="nExp">📥 Exportar a Excel</button></div>'+
    '<div style="overflow-x:auto"><table class="notas"><tr><th rowspan="2">Alumno/a</th>'+CR.map(function(k){ return '<th colspan="3" class="sep" title="'+esc(M.crit[k][L])+'">'+k+'.'+L+' '+esc(M.crit[k].corto)+'</th>'; }).join('')+'<th rowspan="2" class="sep">CE3</th></tr><tr>'+
      CR.map(function(){ return '<th class="sep">H</th><th>A</th><th>Nota</th>'; }).join('')+'</tr>'+
      t.map(function(f){ return '<tr><td'+(f.obs ? ' title="'+esc(f.obs)+'"' : '')+'>'+esc(f.n)+(f.obs ? ' 📝' : '')+'</td>'+CR.map(function(k){ var x = f.c[k]; return '<td class="sep">'+MAL.coma(x.h)+'</td><td>'+MAL.coma(x.a)+'</td><td class="fin '+cls(x.f)+'">'+MAL.coma(x.f)+'</td>'; }).join('')+
        '<td class="sep fin '+cls(f.ce)+'">'+MAL.coma(f.ce)+(f.ce!=null ? ' <small>'+MAL.nivel(f.ce)+'</small>' : '')+'</td></tr>'; }).join('')+'</table></div>'+
    '<p class="estado" style="margin-top:8px">Si un alumno tiene varias observaciones, H es la media. Sin diana, la nota es solo la H (y al revés). Pasa el ratón por 📝 para leer tus observaciones.</p></div>';
  $('nExp').addEventListener('click', function(){
    var filas = [['Alumno/a'].concat([].concat.apply([], CR.map(function(k){ return [k+'.'+L+' H', k+'.'+L+' A', k+'.'+L+' nota']; }))).concat(['CE3','Calificación'])];
    t.forEach(function(f){ filas.push([f.n].concat([].concat.apply([], CR.map(function(k){ var x = f.c[k]; return [x.h, x.a, x.f].map(function(v){ return v==null ? '' : MAL.coma(v); }); }))).concat([f.ce==null ? '' : MAL.coma(f.ce), MAL.nivel(f.ce)])); });
    JAVI.exportarCSV('maleficio-'+G.replace(/º/g,'')+'-seneca', filas);
  });
}

/* ============ MODO ALUMNO (?alumno): la diana en la tablet ============ */
var A = { paso:'clase' };
function pintarAlumno(){
  var c = $('aCaja'), h = '';
  if(A.paso==='clase') h = '<div class="paso"><h2>🎯 La Diana del Pensadero · ¿Cuál es tu clase?</h2><div class="nombres">'+MAL.clases().map(function(g){ return '<button type="button" data-ag="'+g+'">'+g+'</button>'; }).join('')+'</div></div>';
  if(A.paso==='nombre'){
    var E = MAL.evaluacion(G);
    h = '<div class="paso"><h2>'+esc(G)+' · Toca tu nombre</h2><div class="nombres">'+nombres().map(function(n){ var ya = E.auto[n] || MAL.leer('maleficio-diana|'+G+'|'+n); return '<button type="button" data-an="'+esc(n)+'"'+(ya ? ' disabled' : '')+'>'+esc(n)+(ya ? ' ✔' : '')+'</button>'; }).join('')+'</div></div>';
  }
  if(A.paso==='codigo') h = '<div class="paso"><h2>Hola, '+esc(A.n)+'. Escribe el código de la diana</h2><p class="estado">Está en la pizarra.</p><input id="aCod" inputmode="numeric" maxlength="4" autocomplete="off"><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn sec" type="button" data-a="nombre">‹ No soy '+esc(A.n)+'</button><button class="btn" type="button" data-a="entrar">Empezar ›</button></div><p class="err" id="aErr"></p></div>';
  if(A.paso==='frase'){
    var d = M.diana[A.i];
    h = '<div class="paso"><p class="estado">'+esc(A.n)+' · frase '+(A.i+1)+' de '+M.diana.length+'</p><div class="fraseA">'+esc(d.t)+'</div><button class="btn sec" type="button" data-a="leer" style="align-self:center">🔊 Escuchar</button>'+
      '<div class="carasA">'+M.caras.map(function(k){ return '<button type="button" data-cara="'+k.v+'" style="--c:'+k.col+'"><span>'+k.ic+'</span>'+k.t+'</button>'; }).join('')+'</div>'+(A.i ? '<button class="btn sec" type="button" data-a="atras" style="align-self:center">‹ Frase anterior</button>' : '')+'</div>';
  }
  if(A.paso==='fin') h = '<div class="paso"><h2>✨ ¡Gracias, '+esc(A.n)+'!</h2><div class="dianaFin">'+MAL.dianaSVG(A.r, { w:340 })+'</div><p style="font-size:18px">Esta es tu diana: cuanto más cerca del centro, más lo has conseguido. Rojo: emociones y esfuerzo · Azul: normas y juego limpio · Verde: cooperar e incluir.</p><button class="btn" type="button" data-a="otro">👋 Siguiente compañero</button></div>';
  c.innerHTML = h;
  var inp = $('aCod'); if(inp){ inp.focus(); inp.addEventListener('keydown', function(e){ if(e.key==='Enter') c.querySelector('[data-a="entrar"]').click(); }); }
}
function leerFrase(){ if(!window.speechSynthesis) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(M.diana[A.i].t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); }
$('aCaja').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.ag){ var g = b.dataset.ag; var ir = function(){ G = g; A.paso = 'nombre'; pintarAlumno(); }; if(!JAVI.protegerClase(g, { alAbrir:ir })) return; ir(); return; }
  if(b.dataset.an){ A.n = b.dataset.an; A.paso = 'codigo'; pintarAlumno(); return; }
  if(b.dataset.cara){
    A.r[A.i] = +b.dataset.cara; A.i++;
    if(A.i < M.diana.length){ pintarAlumno(); leerFrase(); return; }
    JAVI.escribirLibre({ alumno:MAL.TAG(G), accion:'MalAuto', cartaId:'auto', tipo:A.n, carta:JSON.stringify({ r:A.r }) });
    MAL.guardar('maleficio-diana|'+G+'|'+A.n, '1'); MAL.sonar([523,659,784,1046], 'triangle');
    A.paso = 'fin'; pintarAlumno(); return;
  }
  var a = b.dataset.a;
  if(a==='nombre'){ A.paso = 'nombre'; pintarAlumno(); }
  if(a==='leer') leerFrase();
  if(a==='atras'){ A.i--; pintarAlumno(); }
  if(a==='otro'){ A = { paso:'nombre' }; pintarAlumno(); }
  if(a==='entrar'){
    var v = ($('aCod').value||'').trim();
    MAL.codigoDia(G).then(function(s){
      if(!s){ $('aErr').textContent = 'Aún no se puede: el maestro tiene que prepararla.'; return; }
      if(v!==s){ $('aErr').textContent = 'Ese no es el código. Míralo bien en la pizarra.'; $('aCod').value = ''; return; }
      A.i = 0; A.r = M.diana.map(function(){ return 0; }); A.paso = 'frase'; pintarAlumno(); leerFrase();
    });
  }
});

/* ============ pestañas y arranque ============ */
var VISTAS = ['sombrero','observar','auto','notas'];
function verVista(v){
  if(VISTAS.indexOf(v)<0) v = 'sombrero'; VISTA = v;
  Array.prototype.forEach.call(document.querySelectorAll('.pestanas button'), function(b){ b.setAttribute('aria-selected', b.dataset.v===v ? 'true' : 'false'); });
  VISTAS.forEach(function(k){ $('v-'+k).hidden = k!==v; });
  history.replaceState(null, '', location.search+'#'+v); pintar();
}
function pintar(){ if(!G) return; ({ sombrero:pintarSombrero, observar:pintarObservar, auto:pintarAuto, notas:pintarNotas })[VISTA](); }
Array.prototype.forEach.call(document.querySelectorAll('.pestanas button'), function(b){ b.addEventListener('click', function(){ verVista(b.dataset.v); }); });
$('bPantalla').addEventListener('click', JAVI.pantallaCompleta);
$('bLeer').addEventListener('click', function(){ MAL.aviso('Leyendo la Hoja…'); JAVI.leerHoja().then(function(){ pintar(); MAL.aviso('Hoja leída.'); }).catch(function(){ MAL.aviso('No se ha podido leer la Hoja.'); }); });
JAVI.listo(function(){
  if(ALUMNO){
    document.body.classList.add('alumno'); $('sub').textContent = 'La Diana del Pensadero · autoevaluación';
    VISTAS.forEach(function(k){ $('v-'+k).hidden = true; }); $('v-alumno').hidden = false; pintarAlumno();
  } else {
    MAL.botonesClase($('clases'), function(g){ G = g; obsN = null; mano = { n:'', r:[0,0,0,0,0,0] }; pintar(); });
    verVista((location.hash||'').replace('#',''));
  }
  JAVI.avisoPrueba();
});
})();
</script>

<!DOCTYPE html>
<html lang="es" data-tema="hp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Código de Merlín</title>
<link rel="stylesheet" href="../../comun/javi.css">
<link rel="stylesheet" href="../comun/actividad.css">
<style>
.clases{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-family:var(--f-sub);color:var(--tinta-suave)}
.pest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pest button{font-family:var(--f-sub);font-weight:700;font-size:17px;padding:9px 16px;border-radius:12px;border:2px solid #b8934f;background:#fffaf0;color:#3a2a16;cursor:pointer}
.pest button[aria-pressed="true"]{background:#7a2030;color:#fff;border-color:#7a2030}
.perg{width:100%;max-width:900px;background:linear-gradient(180deg,#fbf2d9,#ecd9a8);border:3px solid #b8934f;border-radius:10px;padding:clamp(18px,3vw,36px);text-align:left;box-shadow:0 12px 26px rgba(0,0,0,.25)}
.perg h2{font-family:'Cinzel Decorative','Cinzel',serif;color:#7a2030;text-align:center;font-size:clamp(28px,4.4vw,50px)}
.perg .sub{text-align:center;font-family:'Cinzel',serif;color:#6b5732;margin-bottom:12px}
.perg ol{margin:0 0 0 1.4em;font-family:'EB Garamond',Georgia,serif;font-size:clamp(21px,2.7vw,32px);line-height:1.4}
.perg li{padding:3px 0}
.perg li .x{margin-left:8px;font-size:15px;border:none;background:none;cursor:pointer;color:#a3392f}
.perg li .m{font-size:15px;border:none;background:none;cursor:pointer;color:#6b5732}
.nueva{display:flex;gap:8px;width:100%;max-width:900px}
.nueva input{flex:1;min-width:0;font-family:'EB Garamond',Georgia,serif;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid #b8934f;background:#fffaf0}
.vacio{font-style:italic;color:#8a7a5a;text-align:center}
.estado{font-size:15px;color:#6b5732}
/* impresión: el Código en un A4 con hueco para las firmas */
.impr{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  .j-envoltorio{display:none!important}
  .impr{display:block;font-family:'EB Garamond',Georgia,serif;color:#2b2116}
  .impr h1{font-family:'Cinzel',serif;color:#7a2030;text-align:center;font-size:30pt;margin-bottom:2mm}
  .impr .s{text-align:center;font-family:'Cinzel',serif;font-size:12pt;color:#6b5732;margin-bottom:6mm}
  .impr ol{font-size:16pt;line-height:1.45;margin-left:10mm}
  .impr .firmas{margin-top:8mm;display:grid;grid-template-columns:repeat(4,1fr);gap:5mm 6mm}
  .impr .firmas div{border-bottom:1px solid #8a7a5a;height:12mm}
  .impr .pie{margin-top:6mm;text-align:center;font-size:11pt;color:#6b5732}
}
</style>
</head>
<body>
<div class="j-envoltorio">
  <header class="cab">
    <h1 class="j-titulo">📜 Código de Merlín<span class="sub">Producto final · El Maleficio de la Discordia</span></h1>
    <a class="volver" href="../?id=maleficio-ef" data-volver="../?id=maleficio-ef">← Volver</a>
    <button class="j-icono" id="bPantalla" type="button" aria-label="Pantalla completa">⛶</button>
  </header>
  <div class="clases">Clase: <span id="clases"></span></div>
  <section class="escena">
    <nav class="pest" id="pest">
      <button type="button" data-v="pacto" aria-pressed="false">🤝 Pacto de Hogwarts (sesión 2)</button>
      <button type="button" data-v="codigo" aria-pressed="true">📜 Código de Merlín (sesiones 7 y 8)</button>
    </nav>
    <div class="perg" id="perg"></div>
    <div class="nueva"><input id="nNorma" type="text" maxlength="140" placeholder="Escribe una norma y pulsa Añadir"><button class="gran" id="bAnadir" type="button">➕ Añadir</button></div>
    <div class="botones">
      <button class="gran verde" id="bGuardar" type="button">💾 Guardar</button>
      <button class="gran sec" id="bCopiar" type="button">🤝 Traer las normas del Pacto</button>
      <button class="gran sec" id="bImprimir" type="button">🖨️ Imprimir para firmar</button>
    </div>
    <p class="estado" id="estado"></p>
  </section>
</div>
<div class="impr" id="impr"></div>

<script src="../../comun/javi.js"></script>
<script src="../comun/barra.js"></script>
<script src="datos.js"></script>
<script src="comun.js"></script>
<script>
(function(){
'use strict';
var $ = MAL.$, esc = MAL.esc, G = null, V = 'codigo', normas = [], cambiado = false;
var TIT = { pacto:'Pacto de Hogwarts', codigo:'Código de Merlín' };
function kBorr(){ return 'maleficio-borrador|'+G+'|'+V; }
function guardado(){ var u = MAL.ultimas(G, 'CodigoMerlin', function(f){ return f.cartaId; })[V]; return u ? u.j.n : null; }
function cargar(){
  var b = MAL.leer(kBorr()); cambiado = !!b;
  normas = b ? JSON.parse(b) : (guardado() || []).slice();
  pintar();
}
function borrador(){ cambiado = true; MAL.guardar(kBorr(), JSON.stringify(normas)); }
function pintar(){
  $('perg').innerHTML = '<h2>'+TIT[V]+'</h2><div class="sub">'+esc(G)+' · Educación Física · CEIP Arias Montano</div>'+
    (normas.length ? '<ol>'+normas.map(function(n, i){ return '<li>'+esc(n)+'<button class="m" type="button" data-sube="'+i+'" title="Subir">▲</button><button class="x" type="button" data-quita="'+i+'" title="Quitar">✕</button></li>'; }).join('')+'</ol>'
      : '<p class="vacio">Todavía no hay normas. Escribidlas entre todos abajo.</p>');
  $('estado').textContent = (cambiado ? '✏️ Hay cambios sin guardar (se quedan en este aparato hasta que pulses Guardar). ' : (guardado() ? '✔ Guardado. ' : ''))+normas.length+' norma'+(normas.length===1 ? '' : 's')+(V==='codigo' ? ' · El Código tiene 10 normas como mucho.' : '');
  $('bCopiar').hidden = V!=='codigo';
  $('impr').innerHTML = '<h1>'+TIT[V]+'</h1><div class="s">'+esc(G)+' · Educación Física · CEIP Arias Montano</div><ol>'+normas.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ol>'+
    '<div class="s" style="margin-top:8mm">Firmamos este código y prometemos cumplirlo para que el Maleficio de la Discordia no vuelva nunca.</div><div class="firmas">'+'<div></div>'.repeat(28)+'</div><div class="pie">⚡ El Maleficio de la Discordia · Javificación</div>';
}
$('perg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.quita!=null){ normas.splice(+b.dataset.quita, 1); borrador(); pintar(); }
  if(b.dataset.sube!=null){ var i = +b.dataset.sube; if(i>0){ var x = normas[i]; normas[i] = normas[i-1]; normas[i-1] = x; borrador(); pintar(); } }
});
function anadir(){
  var t = $('nNorma').value.trim(); if(!t) return;
  if(V==='codigo' && normas.length>=10){ MAL.aviso('El Código de Merlín tiene 10 normas como mucho. Quitad alguna antes.'); return; }
  normas.push(t.charAt(0).toUpperCase()+t.slice(1)); $('nNorma').value = ''; borrador(); pintar();
}
$('bAnadir').addEventListener('click', anadir);
$('nNorma').addEventListener('keydown', function(e){ if(e.key==='Enter') anadir(); });
$('bGuardar').addEventListener('click', function(){
  if(!MAL.conLlave('Para guardar el '+TIT[V]+' de '+G+', escribe tu código.')) return;
  JAVI.escribir({ alumno:MAL.TAG(G), accion:'CodigoMerlin', cartaId:V, tipo:TIT[V], carta:JSON.stringify({ n:normas }) });
  MAL.guardar(kBorr(), null); cambiado = false; pintar(); MAL.aviso('¡'+TIT[V]+' guardado!');
});
$('bCopiar').addEventListener('click', function(){
  var p = MAL.ultimas(G, 'CodigoMerlin', function(f){ return f.cartaId; }).pacto, l = p ? p.j.n : JSON.parse(MAL.leer('maleficio-borrador|'+G+'|pacto') || '[]');
  if(!l.length){ MAL.aviso('Todavía no hay Pacto de Hogwarts en '+G+'.'); return; }
  l.forEach(function(n){ if(normas.indexOf(n)<0 && normas.length<10) normas.push(n); }); borrador(); pintar();
});
$('bImprimir').addEventListener('click', function(){ window.print(); });
$('pest').addEventListener('click', function(e){
  var b = e.target.closest('[data-v]'); if(!b) return; V = b.dataset.v;
  Array.prototype.forEach.call($('pest').children, function(x){ x.setAttribute('aria-pressed', x===b ? 'true' : 'false'); });
  cargar();
});
$('bPantalla').addEventListener('click', JAVI.pantallaCompleta);
JAVI.listo(function(){ MAL.botonesClase($('clases'), function(g){ G = g; cargar(); }); JAVI.avisoPrueba(); });
})();
</script>
</body>
</html>

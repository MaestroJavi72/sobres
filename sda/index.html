<!DOCTYPE html>
<html lang="es" data-tema="hp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Situación de aprendizaje</title>
<link rel="stylesheet" href="../comun/javi.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{ --perg:#f6ead0; --perg2:#ead7a8; --tinta-p:#3a2a16; --tinta-p2:#6b5732; --oro:#c9a34a; --granate:#7a2030; --noche:#0e2a28; }
body{background:var(--fondo-img),var(--fondo)}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.barra .esp{flex:1}
.volver{font-family:var(--f-sub);font-weight:700;font-size:16px;text-decoration:none;padding:9px 16px;border-radius:999px;
  background:linear-gradient(180deg,#f3d27a,#c9972e);color:#2b1c05;border:2px solid #fff1b8;box-shadow:0 3px 10px rgba(0,0,0,.35)}

/* ---------- portada de la SA ---------- */
.heroe{position:relative;border-radius:26px;padding:clamp(20px,4vw,40px);margin-bottom:18px;overflow:hidden;
  background:radial-gradient(ellipse at 85% 0%,rgba(232,200,114,.25),transparent 60%),linear-gradient(160deg,#14403a,#0a1f22);border:3px solid var(--oro);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.heroe .tema{font-family:var(--f-sub);font-weight:700;color:#e8cf8a;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.heroe h1{font-family:var(--f-titulo);color:#f3d27a;text-shadow:0 2px 14px rgba(232,200,114,.45);font-size:clamp(30px,5.4vw,58px);line-height:1.05;margin:6px 0 10px}
.heroe .sub{color:#d9cfae;font-size:18px;line-height:1.4;max-width:820px}
.heroe .fosil{position:absolute;right:-10px;bottom:-20px;font-size:150px;opacity:.12;transform:rotate(-14deg);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{font-family:var(--f-sub);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(232,200,114,.15);border:1px solid rgba(232,200,114,.5);color:#f6e3a1}
.chips a{color:inherit}

/* ---------- índice + documento ---------- */
.cuerpo{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){ .cuerpo{grid-template-columns:minmax(0,1fr)} }
.doc,.indice{min-width:0}
.heroe{overflow:hidden}
.indice{position:sticky;top:12px;background:rgba(10,31,34,.88);border:2px solid #2f5a54;border-radius:18px;padding:14px}
.indice h2{font-family:var(--f-sub);color:#e8cf8a;font-size:15px;letter-spacing:.08em;margin-bottom:8px}
.indice a{display:block;color:#d9cfae;text-decoration:none;padding:6px 8px;border-radius:8px;font-size:16px;line-height:1.25}
.indice a:hover,.indice a.activo{background:rgba(232,200,114,.15);color:#ffe9a6}
@media (max-width:900px){ .indice{position:static;display:flex;flex-wrap:wrap;gap:4px} .indice h2{width:100%} .indice a{font-size:14px;padding:5px 9px;border:1px solid #2f5a54;border-radius:999px} }

.doc{background:linear-gradient(180deg,var(--perg),var(--perg2));color:var(--tinta-p);border:3px solid #b8934f;border-radius:22px;padding:clamp(16px,3.4vw,40px);
  box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.5}
.doc h2{font-family:'Cinzel',Georgia,serif;font-weight:800;color:var(--granate);font-size:clamp(22px,2.8vw,30px);margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid rgba(122,32,48,.25);scroll-margin-top:16px}
.doc h2:first-child{margin-top:0}
.doc h3{font-family:'Cinzel',Georgia,serif;color:#5a3d12;font-size:clamp(18px,2.2vw,22px);margin:22px 0 8px}
.doc p{margin:8px 0}
.doc ul,.doc ol{margin:8px 0 8px 24px}
.doc li{margin:4px 0}
.doc strong{color:#4a2a10}
.doc blockquote{margin:14px 0;padding:14px 18px;border-left:5px solid var(--oro);background:rgba(255,255,255,.45);border-radius:0 14px 14px 0;font-style:italic}
.doc table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0;font-size:16.5px;background:rgba(255,255,255,.4);border-radius:14px;overflow:hidden;border:1px solid #c4a466}
.doc th{background:var(--noche);color:#f3d27a;font-family:'Cinzel',Georgia,serif;font-size:14.5px;text-align:left;padding:9px 10px}
.doc td{padding:8px 10px;border-top:1px solid #d9c08a;vertical-align:top}
.doc tr:nth-child(even) td{background:rgba(201,163,74,.08)}
.tablaScroll{overflow-x:auto}

/* chips de criterios e interactivas */
.crit{display:inline-block;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:.82em;padding:1px 8px;border-radius:999px;background:var(--noche);color:#f3d27a;cursor:pointer;white-space:nowrap;border:none}
.crit:hover{background:#1d5c54}
.inter.listo{background:#2d6b47;color:#fff;text-decoration:none}
.inter.listo:hover{background:#1c4d31}
.inter{display:inline-block;font-weight:700;font-size:.85em;padding:1px 7px;border-radius:7px;background:#e2d2ff;color:#3d2a7a;white-space:nowrap}
.globo{position:fixed;z-index:80;max-width:min(92vw,420px);background:#0e2a28;color:#f6ead0;border:2px solid var(--oro);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.globo b{color:#f3d27a;font-family:'Cinzel',Georgia,serif}

/* ---------- sesiones ---------- */
.sesiones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:14px 0}
.ses{position:relative;display:flex;flex-direction:column;gap:6px;background:#fffaf0;border:2px solid #d9c08a;border-radius:16px;padding:14px 14px 12px}
.ses.hoy{border-color:var(--granate);box-shadow:0 0 0 4px rgba(122,32,48,.18)}
.ses.hoy::after{content:'HOY';position:absolute;top:-10px;right:12px;background:var(--granate);color:#fff;font:700 11px/1 'Cinzel',serif;padding:4px 8px;border-radius:8px;letter-spacing:.1em}
.ses.pasada{opacity:.62}
.ses .cab{display:flex;align-items:center;gap:10px}
.ses .num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--noche);color:#f3d27a;font:800 17px 'Cinzel',serif}
.ses .fch{font-family:'Cinzel',serif;font-weight:700;color:#5a3d12;font-size:15px;line-height:1.2}
.ses .dur{margin-left:auto;font:700 13px 'Cinzel',serif;padding:3px 9px;border-radius:999px;background:#f3d27a;color:#3a2a16}
.ses .dur.largo{background:var(--granate);color:#fff}
.ses h4{font-family:'Cinzel',serif;color:var(--granate);font-size:17px;line-height:1.2}
.ses p{font-size:16px;line-height:1.35;margin:0}
.ses .ints{display:flex;flex-wrap:wrap;gap:4px}
.ses .recurso{align-self:flex-start;font:700 14px 'Cinzel',serif;color:#fff;background:#7a2030;text-decoration:none;padding:4px 10px;border-radius:9px}
.ses .ir{margin-top:auto;align-self:flex-start;font:700 14px 'Cinzel',serif;color:#14403a;text-decoration:none;border-bottom:2px solid var(--oro)}

.cargando{color:#d9cfae;font-size:18px;padding:30px;text-align:center}

/* ---------- cabecera compacta + pestañas ---------- */
.heroe.compacta{padding:16px clamp(16px,3vw,26px);margin-bottom:12px;border-radius:20px}
.heroe.compacta h1{font-size:clamp(24px,3.6vw,38px);margin:2px 0 4px}
.heroe.compacta .sub{font-size:16px}
.heroe.compacta .fosil{font-size:90px;bottom:-12px}
.pestanas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pestanas button{font-family:var(--f-sub);font-weight:700;font-size:17px;padding:10px 18px;border-radius:14px;cursor:pointer;
  background:rgba(10,31,34,.85);color:#e8cf8a;border:2px solid #2f5a54}
.pestanas button[aria-selected="true"]{background:linear-gradient(180deg,#f3d27a,#c9972e);color:#2b1c05;border-color:#fff1b8}
.panel[hidden]{display:none!important}

/* ---------- semana ---------- */
.semnav{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:rgba(10,31,34,.85);border:2px solid #2f5a54;border-radius:16px;padding:8px 10px}
.semnav button{width:44px;height:44px;border-radius:12px;border:2px solid var(--oro);background:transparent;color:#f3d27a;font-size:22px;cursor:pointer}
.semnav button:disabled{opacity:.3;cursor:default}
.semnav .t{flex:1;text-align:center;font-family:var(--f-sub);font-weight:700;color:#f3d27a;font-size:19px}
.semnav .t small{display:block;color:#d9cfae;font-weight:400;font-size:14px}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.dia{position:relative;background:linear-gradient(180deg,var(--perg),var(--perg2));color:var(--tinta-p);border:3px solid #b8934f;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dia.hoy{border-color:#f3d27a;box-shadow:0 0 0 4px rgba(243,210,122,.45),0 10px 24px rgba(0,0,0,.35)}
.dia.hoy::after{content:'HOY';position:absolute;top:-11px;right:14px;background:var(--granate);color:#fff;font:700 12px/1 'Cinzel',serif;padding:5px 9px;border-radius:8px;letter-spacing:.1em}
.dia.pasada{opacity:.7}
.dia .cab{display:flex;align-items:center;gap:10px}
.dia .num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--noche);color:#f3d27a;font:800 17px 'Cinzel',serif}
.dia .fch{font-family:'Cinzel',serif;font-weight:800;color:var(--granate);font-size:18px;line-height:1.1;text-transform:capitalize}
.dia .fch small{display:block;font-weight:700;color:#6b5732;font-size:13px;text-transform:none}
.dia h4{font-family:'Cinzel',serif;color:#3a2a16;font-size:18px;line-height:1.2}
.dia p{font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.35}
.botones{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.btn{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:12px;padding:9px 12px;font-family:var(--f-sub);font-weight:700;font-size:16px;line-height:1.2}
.btn .ic{font-size:24px;flex:none}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.85}
.btn.juego{background:#14403a;color:#f6e3a1;border:2px solid #2d6b47}
.btn.juego:hover{background:#1d5c54}
.btn.ficha{background:#fffaf0;color:#7a2030;border:2px solid #d9c08a}
.btn.ficha:hover{background:#fff}
.btn.plan{background:transparent;color:#14403a;border:2px dashed #b8934f;font-size:14px;padding:6px 12px}
.etq{margin-left:auto;font-size:11px;font-family:'Cinzel',serif;padding:3px 7px;border-radius:999px;background:#f3d27a;color:#3a2a16;white-space:nowrap}
.vacio{color:#d9cfae;font-size:18px;text-align:center;padding:24px}

/* ---------- juegos y fichas ---------- */
.seccion{font-family:var(--f-sub);color:#f3d27a;font-size:20px;margin:6px 0 10px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;margin-bottom:20px}
.galeria .btn{min-height:64px}
@media print{ .pestanas,.semnav{display:none!important} }
@media print{
  body{background:#fff!important}
  .barra,.indice,.ir,.heroe .fosil{display:none!important}
  .cuerpo{display:block}
  .heroe{background:#fff!important;border:2px solid #999;box-shadow:none;color:#000}
  .heroe h1{color:#000;text-shadow:none} .heroe .sub,.heroe .tema{color:#333} .chips span{color:#000;background:#fff;border-color:#999}
  .doc{background:#fff;box-shadow:none;border:none;padding:0;font-size:12pt}
  .doc th{background:#eee;color:#000}
  .ses{break-inside:avoid;background:#fff} .crit{background:#fff;color:#000;border:1px solid #999}
  .doc h2{break-after:avoid}
}
</style>
</head>
<body>
<div class="j-envoltorio">
  <div class="barra">
    <a class="volver" href="../?profe#planificacion" data-volver="../?profe#planificacion">← Volver</a>
    <span class="esp"></span>
    <a class="j-icono" id="bPlan" href="../planificacion/?profe#sda" title="Ver en la planificación" style="text-decoration:none;width:auto;padding:0 12px;font-family:var(--f-sub);font-weight:700;font-size:15px">📅 Planificación</a>
    <button class="j-icono" id="bImprimir" type="button" aria-label="Imprimir" title="Imprimir">🖨️</button>
    <button class="j-icono" id="bPantalla" type="button" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
  </div>

  <header class="heroe compacta" id="heroe">
    <span class="fosil" aria-hidden="true">🦴</span>
    <div class="tema" id="hTema">Situación de aprendizaje</div>
    <h1 id="hTit">Cargando…</h1>
    <div class="sub" id="hSub"></div>
  </header>

  <div class="pestanas" role="tablist">
    <button type="button" role="tab" data-p="semana" aria-selected="true">📅 Semana</button>
    <button type="button" role="tab" data-p="juegos" aria-selected="false">🎮 Juegos y fichas</button>
    <button type="button" role="tab" data-p="plan" aria-selected="false">📜 Planificación completa</button>
  </div>

  <section class="panel" id="p-semana">
    <div class="semnav"><button type="button" id="semAnt" aria-label="Semana anterior">‹</button><div class="t" id="semTit"></div><button type="button" id="semSig" aria-label="Semana siguiente">›</button></div>
    <div class="dias" id="dias"><p class="vacio">Cargando…</p></div>
  </section>

  <section class="panel" id="p-juegos" hidden>
    <h2 class="seccion">🎮 Juegos para la pizarra</h2>
    <div class="galeria" id="galJuegos"></div>
    <h2 class="seccion">🖨️ Fichas e imprimibles</h2>
    <div class="galeria" id="galFichas"></div>
  </section>

  <section class="panel" id="p-plan" hidden>
    <div class="chips" id="hChips" style="margin:0 0 12px"></div>
    <div class="cuerpo">
      <nav class="indice" id="indice" aria-label="Índice"><h2>ÍNDICE</h2></nav>
      <article class="doc" id="doc"><p class="cargando">Abriendo el pergamino…</p></article>
    </div>
  </section>
</div>
<div class="globo" id="globo" role="tooltip" hidden></div>

<script src="../comun/javi.js"></script>
<script>
(function(){
'use strict';
function $(id){ return document.getElementById(id); }
var U = JAVI.util;
var id = new URLSearchParams(location.search).get('id') || 'tema2-lengua-4a';
var CRIT = null, SDA = null;
var DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function esc(t){ var d = document.createElement('div'); d.textContent = t==null ? '' : t; return d.innerHTML; }
function fechaBonita(f){ var p = f.split('-'); return DIAS[JAVI.diaSemana(f)]+' '+(+p[2])+' '+MESES[+p[1]-1]; }

/* ---------- criterios: el texto completo sale al tocar el código ---------- */
function textoCriterio(cod){
  var m = cod.match(/LCL\.2\.(\d+\.\d+)/); if(!m || !CRIT) return null;
  var c = CRIT.areas.LCL.criterios.filter(function(x){ return x.id===m[1]; })[0];
  return c ? c['4'] : null;
}
function marcarCodigos(root){
  var andar = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodos = [], n;
  while((n = andar.nextNode())) if(/LCL\.2\.\d+\.\d+|\bI-\d{1,2}\b/.test(n.nodeValue) && !n.parentNode.closest('.crit,.inter')) nodos.push(n);
  nodos.forEach(function(t){
    var frag = document.createElement('span');
    frag.innerHTML = esc(t.nodeValue).replace(/LCL\.2\.\d+\.\d+/g, function(c){ return '<button type="button" class="crit" data-c="'+c+'">'+c+'</button>'; })
                                      .replace(/\b(I-\d{1,2})\b/g, function(c){
                                        var u = SDA && SDA.enlaces && SDA.enlaces[c];   /* actividad ya creada: enlace */
                                        return u ? '<a class="inter listo" href="'+u+(JAVI.ES_PROFE ? '?profe' : '')+'" title="Abrir la actividad">▶ '+c+'</a>' : '<span class="inter">'+c+'</span>';
                                      });
    while(frag.firstChild) t.parentNode.insertBefore(frag.firstChild, t);
    t.remove();
  });
}
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('.crit'), g = $('globo');
  if(!b){ g.hidden = true; return; }
  var tx = textoCriterio(b.dataset.c);
  g.innerHTML = '<b>'+esc(b.dataset.c)+'</b><br>'+(tx ? esc(tx) : 'Texto no encontrado en los criterios del 2º ciclo.')+'<br><small style="opacity:.75">Orden de 30 de mayo de 2023 · 4º</small>';
  g.hidden = false;
  var r = b.getBoundingClientRect(), w = Math.min(innerWidth*0.92, 420);
  g.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left))+'px';
  g.style.top = (r.bottom + 8 + g.offsetHeight > innerHeight ? Math.max(8, r.top - g.offsetHeight - 8) : r.bottom + 8)+'px';
});

/* recursos imprimibles (fichas, plantillas…) de una sesión */
function recursosDe(n){ return ((SDA && SDA.recursos) || []).filter(function(r){ return (r.sesiones||[]).indexOf(n)>=0; }); }
var PROFE = JAVI.ES_PROFE ? '?profe' : '';
var ICONOS = { 'I-1':'📖','I-2':'👏','I-3':'🔀','I-4':'🗂️','I-5':'🏭','I-6':'⚙️','I-7':'🔍','I-8':'🎡','I-9':'🃏','I-10':'🔮','I-11':'⚖️','I-12':'💡','I-13':'🎙️','I-14':'📚','I-15':'🎲','I-16':'⚔️' };
var DIAS_LARGOS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* «I-4 Clasificador de sílabas (puntúa), I-5 …» → [{cod, nombre, etq}] */
function actividades(s){
  return (s.interactivas || '').split(/,\s*(?=I-)/).filter(Boolean).map(function(x){
    var m = x.trim().match(/^(I-\d+)\s+(.*?)\s*(?:\(([^)]*)\))?$/);
    return m ? { cod:m[1], nombre:m[2], etq:m[3] || '' } : null;
  }).filter(Boolean);
}
function btnJuego(a, extra){
  var u = SDA.enlaces && SDA.enlaces[a.cod];
  var etq = /^puntúa$/i.test(a.etq) ? '<span class="etq">⭐ puntúa</span>' : /ampliaci/i.test(a.etq) ? '<span class="etq">➕ ampliación</span>' : '';
  return u ? '<a class="btn juego" href="'+u+PROFE+'"><span class="ic">'+(ICONOS[a.cod]||'🎮')+'</span><span>'+esc(a.nombre)+(extra ? '<small>'+extra+'</small>' : '')+'</span>'+etq+'</a>' : '';
}
function btnFicha(r, extra){ return '<a class="btn ficha" href="'+r.url+PROFE+'"><span class="ic">'+r.ic+'</span><span>'+esc(r.n.replace(/^Ficha para familias · /, 'Ficha: '))+(extra ? '<small>'+extra+'</small>' : '')+'</span></a>'; }

/* ---------- pestaña Semana ---------- */
var semana = null;
function semanas(){ var l = []; SDA.sesiones.forEach(function(s){ var w = JAVI.lunesDe(s.fecha); if(l.indexOf(w)<0) l.push(w); }); return l; }
function pintarSemana(){
  var ws = semanas(), i = ws.indexOf(semana), hoy = U.clave(new Date());
  var fin = JAVI.sumarDias(semana, 4), p1 = semana.split('-'), p2 = fin.split('-');
  $('semTit').innerHTML = 'Semana '+(i+1)+' de '+ws.length+'<small>del '+(+p1[2])+' '+MESES[+p1[1]-1]+' al '+(+p2[2])+' '+MESES[+p2[1]-1]+'</small>';
  $('semAnt').disabled = i<=0; $('semSig').disabled = i>=ws.length-1;
  $('dias').innerHTML = SDA.sesiones.map(function(s, k){
    if(JAVI.lunesDe(s.fecha)!==semana) return '';
    var p = s.fecha.split('-');
    return '<article class="dia'+(s.fecha===hoy ? ' hoy' : s.fecha < hoy ? ' pasada' : '')+'">'+
      '<div class="cab"><span class="num">'+(k+1)+'</span><span class="fch">'+DIAS_LARGOS[JAVI.diaSemana(s.fecha)]+' '+(+p[2])+'<small>Sesión '+(k+1)+' · '+esc(s.duracion)+'</small></span></div>'+
      '<h4>'+esc(s.titulo)+'</h4><p>'+esc(s.objetivo)+'</p>'+
      '<div class="botones">'+actividades(s).map(function(a){ return btnJuego(a); }).join('')+
        recursosDe(k+1).map(function(r){ return btnFicha(r); }).join('')+
        (JAVI.ES_PROFE ? '<a class="btn plan" href="../sesion/?profe&ambito=tutoria&grupo=4oA&asig=LCL&fecha='+s.fecha+'">📋 Planificar esta sesión</a>' : '')+
      '</div></article>';
  }).join('') || '<p class="vacio">No hay sesiones esta semana.</p>';
}
function moverSemana(d){ var ws = semanas(), i = ws.indexOf(semana)+d; if(ws[i]){ semana = ws[i]; pintarSemana(); } }
$('semAnt').addEventListener('click', function(){ moverSemana(-1); });
$('semSig').addEventListener('click', function(){ moverSemana(1); });

/* ---------- pestaña Juegos y fichas ---------- */
function pintarGalerias(){
  var j = [];
  SDA.sesiones.forEach(function(s, k){ actividades(s).forEach(function(a){ j.push(btnJuego(a, 'Sesión '+(k+1)+' · '+fechaBonita(s.fecha))); }); });
  $('galJuegos').innerHTML = j.join('');
  $('galFichas').innerHTML = (SDA.recursos||[]).map(function(r){ return btnFicha(r, 'Sesión '+r.sesiones.join(', ')); }).join('');
}

/* ---------- pestañas ---------- */
function abrir(p){
  if(['semana','juegos','plan'].indexOf(p)<0) p = 'semana';
  Array.prototype.forEach.call(document.querySelectorAll('.pestanas button'), function(b){ b.setAttribute('aria-selected', b.dataset.p===p ? 'true' : 'false'); });
  ['semana','juegos','plan'].forEach(function(x){ $('p-'+x).hidden = x!==p; });
}
document.querySelector('.pestanas').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  abrir(b.dataset.p); history.replaceState(null, '', '#'+b.dataset.p);
});

/* ---------- pintar ---------- */
function pintar(md){
  /* título y fecha del documento van a la portada */
  var lineas = md.split('\n'), h1 = (lineas[0]||'').replace(/^#\s*/,'');
  var cuerpo = lineas.slice(1).join('\n').replace(/^\s*\n?[^\n#|]*\d{4}[^\n]*\n/, '');
  $('hTit').textContent = SDA ? SDA.titulo : h1;
  $('hTema').textContent = h1.split('·')[0].trim() || 'Situación de aprendizaje';
  document.title = SDA ? SDA.titulo : h1;
  if(SDA){
    var fs = SDA.sesiones.map(function(s){ return s.fecha; });
    $('hSub').textContent = SDA.grupo+' · Lengua · '+SDA.sesiones.length+' sesiones, del '+fechaBonita(fs[0])+' al '+fechaBonita(fs[fs.length-1]);
    $('hChips').innerHTML = ['📖 '+SDA.unidad, '🎯 '+SDA.criterios.length+' criterios', '✍️ '+SDA.producto.split('(')[0].trim()].map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
    /* semana que se abre: la de hoy, o la siguiente con clase, o la última */
    var ws = semanas(), hoyW = JAVI.lunesDe(U.clave(new Date()));
    semana = ws.filter(function(w){ return w>=hoyW; })[0] || ws[ws.length-1];
    pintarSemana(); pintarGalerias();
  } else {
    $('hSub').textContent = (md.match(/## Datos generales\s+([^\n]+)/)||[])[1] || '';
    abrir('plan');
  }
  var doc = $('doc');
  doc.innerHTML = marked.parse(cuerpo);
  /* tablas anchas con desplazamiento en el móvil */
  Array.prototype.forEach.call(doc.querySelectorAll('table'), function(t){ var w = document.createElement('div'); w.className = 'tablaScroll'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  marcarCodigos(doc);
  /* índice */
  var ind = $('indice'), n = 0;
  Array.prototype.forEach.call(doc.querySelectorAll('h2'), function(h){
    h.id = 'sec'+(++n);
    var a = document.createElement('a'); a.href = '#'+h.id; a.textContent = h.textContent; ind.appendChild(a);
  });
}

function desdeHash(){ var h = location.hash.slice(1); abrir(/^sec\d+$/.test(h) ? 'plan' : h); }
desdeHash();
window.addEventListener('hashchange', desdeHash);
$('bImprimir').addEventListener('click', function(){ window.print(); });
$('bPantalla').addEventListener('click', JAVI.pantallaCompleta);
JAVI.listo(function(){
  document.documentElement.setAttribute('data-tema', 'hp');
  SDA = JAVI.sdas().filter(function(s){ return s.id===id; })[0] || null;
  Promise.all([
    fetch('../data/sda/'+encodeURIComponent(id)+'.md', { cache:'no-store' }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }),
    fetch('../data/criterios.json').then(function(r){ return r.json(); }).catch(function(){ return null; })
  ]).then(function(res){ CRIT = res[1]; pintar(res[0]); })
    .catch(function(){ $('doc').innerHTML = '<p class="cargando" style="color:#7a2030">No se ha encontrado esta situación de aprendizaje.</p>'; });
});
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Copa de las Casas · Lengua</title>
<style>
:root{--gold:#eeba30;--ink:#2b1d0e;--night:#0b1026}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.05vw + .7vh,30px)}
body{margin:0;min-height:100vh;font-family:Georgia,'Palatino Linotype','Book Antiqua',serif;color:#fff;
  background:radial-gradient(ellipse at 50% 0,#2a3375 0,#0b1026 55%,#05060f 100%) fixed;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body:before{content:'';position:fixed;inset:0;pointer-events:none;animation:tw 3s infinite alternate;
  background-image:radial-gradient(2px 2px at 8% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 60%,#fff,transparent),
  radial-gradient(2px 2px at 35% 25%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 48% 75%,#fff,transparent),
  radial-gradient(2px 2px at 61% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 73% 48%,#ffe9a8,transparent),
  radial-gradient(2px 2px at 86% 28%,#fff,transparent),radial-gradient(1.5px 1.5px at 93% 70%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 15% 88%,#fff,transparent),radial-gradient(2px 2px at 55% 42%,#fff,transparent)}
@keyframes tw{from{opacity:.45}to{opacity:1}}
h1,h2,h3{margin:.3em 0;font-weight:bold}
input,textarea,select{font:inherit;padding:.45rem .6rem;border-radius:.5rem;border:2px solid #b08a45;background:#fffaf0;color:var(--ink);
  -webkit-user-select:text;user-select:text;max-width:100%}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:.7rem;padding:.55rem 1rem;background:#4a3691;color:#fff;
  box-shadow:0 .22rem 0 rgba(0,0,0,.45);min-height:2.7rem;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.12)}
button:active{transform:translateY(.18rem);box-shadow:none}
button:disabled{opacity:.4;cursor:default;filter:none}
.gold{background:linear-gradient(#f9dd7e,#c9952b);color:var(--ink);font-weight:bold}
.big{font-size:1.3rem;padding:.8rem 1.6rem}
.good{background:#2e8b45}.bad{background:#b3472f}
.parch{background:linear-gradient(135deg,#f9eecd,#e8d09a);color:var(--ink);border-radius:.9rem;border:2px solid #b08a45;
  box-shadow:inset 0 0 2.2rem rgba(120,80,20,.35),0 .3rem 1rem rgba(0,0,0,.5)}
.pad{padding:1rem 1.2rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;justify-content:center;margin:.6rem 0}
.wrap{max-width:70rem;margin:0 auto;padding:1rem;position:relative}
.bar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.bar h1{flex:1;color:var(--gold);text-shadow:0 0 .6rem rgba(238,186,48,.5)}
small{opacity:.8}
/* inicio */
.home{text-align:center;padding-top:max(3vh,3.4rem)}
.title{font-size:3.4rem;color:var(--gold);letter-spacing:.08em;margin:0;text-shadow:0 0 1rem rgba(238,186,48,.7),0 .2rem 0 #6b4a0e;animation:glow 2.5s infinite alternate}
@keyframes glow{from{text-shadow:0 0 .5rem rgba(238,186,48,.5),0 .2rem 0 #6b4a0e}to{text-shadow:0 0 1.8rem rgba(255,220,120,1),0 .2rem 0 #6b4a0e}}
.title span{display:inline-block;animation:bob 2.4s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-.35rem)}}
.sub{font-size:1.4rem;font-style:italic;opacity:.9}
.castle{width:min(60vw,32rem);display:block;margin:.5rem auto 0}
.candles{position:absolute;inset:0;pointer-events:none}
.candle{position:absolute;width:.5rem;height:2rem;background:linear-gradient(#fff8e0,#d9c48a);border-radius:.15rem;animation:float 4s infinite ease-in-out}
.candle:before{content:'';position:absolute;left:50%;top:-1rem;width:.7rem;height:1.1rem;margin-left:-.35rem;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(#fff,#ffb52e 60%,transparent 75%);animation:flick .25s infinite alternate;box-shadow:0 0 1.2rem .3rem rgba(255,180,60,.6)}
@keyframes float{50%{transform:translateY(-1rem)}}
@keyframes flick{to{transform:scale(1.15,.9)}}
.crests{display:flex;justify-content:center;gap:1rem;margin:1rem 0;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .8rem;border-radius:2rem;background:var(--c);color:#fff;border:3px solid var(--c2);font-weight:bold;white-space:nowrap}
.hb b{color:var(--c2);filter:brightness(1.5)}
/* temas */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem;margin:.8rem 0}
.grp{background:#fffaf0;border:3px solid #b08a45;color:var(--ink);text-align:left;box-shadow:none;opacity:.55}
.grp.on{opacity:1;background:#ffe9a1;border-color:#8a5a00}
.grp b{display:block;font-size:1.1rem}
.opts2{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.opts2 label,.form label{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;font-weight:bold}
/* casas */
.hcols{display:grid;grid-template-columns:repeat(var(--nh,4),minmax(0,1fr));gap:.7rem}
@media(max-width:700px){.hcols{grid-template-columns:repeat(2,1fr)}}
.hcol{border-radius:.8rem;padding:.6rem;background:var(--c);border:3px solid var(--c2);min-height:8rem}
.hcol h3{text-align:center;color:#fff}
.stu{display:inline-block;margin:.15rem;padding:.3rem .6rem;min-height:0;font-size:.95rem;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:none;border-radius:1rem}
.un .stu{background:#fff}
/* juego */
.game{display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;align-items:stretch;padding:.4rem;background:rgba(5,6,15,.9);border-bottom:2px solid var(--gold)}
#score{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--nh,4),minmax(0,1fr));gap:.4rem}
.hs{display:flex;align-items:center;justify-content:center;gap:.4rem;min-width:0;padding:.25rem .5rem;background:var(--c);border:3px solid var(--c2);min-height:0;text-align:left}
.hs svg{height:3.2rem;flex:none}
.hs .hn{flex:1;font-size:.95rem;line-height:1.1}
.hs b{font-size:1.9rem;color:#fff;text-shadow:0 .1rem 0 #000}
.hs.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.12)}}
@media(max-width:1100px){.hs .hn{font-size:.75rem}}
@media(max-width:800px){.hs .hn{display:none}.top{flex-wrap:wrap}.tools{width:100%;justify-content:center}.hs b{font-size:1.4rem}.hs svg{height:2.4rem}.cell{font-size:.55rem!important;min-height:3rem!important}}
.tools{display:flex;gap:.3rem}
.tools button{padding:.3rem .6rem;font-size:1.3rem;min-width:2.8rem}
#stage{flex:1;padding:.7rem;max-width:80rem;width:100%;margin:0 auto}
.intro{max-width:44rem;margin:2vh auto;text-align:center;padding:1.2rem}
.intro .ge{font-size:4.5rem;line-height:1;animation:bob 2s infinite}
.intro h2{font-size:2.2rem}
.intro p{font-size:1.15rem;margin:.3rem 0}
.intro .hb{font-size:1.3rem}
.vs{color:#b3472f;font-size:1.5rem;margin:0 .4rem}
.rn{font-size:.95rem;opacity:.7}
.phead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.gname{font-weight:bold;color:var(--gold);font-size:1.15rem}
#timer{margin-left:auto;display:flex;align-items:center;gap:.5rem;min-width:12rem}
#timer b{font-size:1.4rem;min-width:4rem}
.tbar{flex:1;height:.9rem;background:rgba(255,255,255,.2);border-radius:1rem;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#f9dd7e,#e0652d);transition:width 1s linear}
.qcard{padding:.7rem 1.1rem;margin:.5rem 0}
.readbox{padding:.6rem 1rem;margin:.5rem 0;font-size:1.25rem;line-height:1.45;max-height:38vh;overflow:auto;-webkit-user-select:text;user-select:text}
.qmeta{font-size:.8rem;opacity:.7}
.qtext{font-size:1.75rem;font-weight:bold;line-height:1.25}
.blank{display:inline-block;min-width:4rem;border-bottom:.2rem solid var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.opt{font-size:1.5rem;padding:.9rem;background:#3d2c7d;border:3px solid #a99cff}
.opt.good,.sn.good,.chip.good{background:#2e8b45!important;border-color:#b6ffb6;color:#fff}
.opt.bad,.sn.bad{background:#8a8a8a!important;border-color:#ccc}
.opt.gone{visibility:hidden}
.fillrow{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.fillrow input{font-size:1.6rem;width:min(100%,24rem);text-align:center}
.ordline{min-height:4.2rem;border:3px dashed var(--gold);border-radius:.8rem;padding:.4rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;justify-content:center;background:rgba(255,255,255,.07)}
.ordpool{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.6rem 0;min-height:3.4rem}
.chip{font-size:1.4rem;background:#fffaf0;color:var(--ink);border:3px solid #b08a45}
.hint{opacity:.6;font-style:italic}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 2rem}
.match button{font-size:1.3rem;background:#fffaf0;color:var(--ink);border:4px solid #b08a45}
.match button.cur{outline:.3rem solid var(--gold)}
.openbox{text-align:center;font-size:1.2rem}
.openbox details{background:rgba(255,255,255,.12);padding:.5rem;border-radius:.5rem;margin:.4rem auto;max-width:40rem}
.jokers{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:.8rem;font-size:.95rem}
.jokers button{background:#6b4a0e;min-height:2.3rem;padding:.3rem .8rem}
.scene{position:relative;height:17vh;min-height:6.5rem;border-radius:.8rem;overflow:hidden;background:rgba(255,255,255,.06);border:2px solid rgba(238,186,48,.4);display:flex;align-items:center;justify-content:center;gap:1rem}
.stext{font-size:1.2rem;max-width:50%;text-align:center}
/* snitch */
.arena{position:relative;height:42vh;min-height:15rem;border-radius:.8rem;overflow:hidden;border:2px solid rgba(238,186,48,.4);background:linear-gradient(#1b2a66,#234d2c)}
.sn{position:absolute;left:0;top:0;font-size:1.45rem;font-weight:bold;color:var(--ink);background:radial-gradient(circle at 35% 30%,#fff3b0,#e2a91d);border:3px solid #8a5a00;border-radius:3rem;padding:.6rem 1.2rem;box-shadow:0 0 1rem rgba(255,220,100,.7);max-width:45%}
.sn:before,.sn:after{content:'';position:absolute;top:-.7rem;width:2.2rem;height:1.1rem;background:rgba(255,255,255,.85);border-radius:100% 0 100% 0;animation:flap .18s infinite alternate}
.sn:before{left:-1.5rem;transform-origin:right bottom}
.sn:after{right:-1.5rem;transform:scaleX(-1);transform-origin:left bottom}
@keyframes flap{to{top:-.1rem;height:.6rem}}
/* pociones */
.pot{position:relative;width:9rem;height:80%;background:#22232b;border-radius:.8rem .8rem 50% 50%/.8rem .8rem 70% 70%;border-top:.6rem solid #44464f;overflow:hidden}
.liq{position:absolute;left:0;right:0;top:0;height:45%;background:#3fb6c9;transition:background .6s}
.liq.miss{background:#b0429f}.liq.ok{background:#3ecb5a;box-shadow:0 0 2rem #7dff9a}.liq.ko{background:#d9822b}
.liq i{position:absolute;bottom:20%;width:.9rem;height:.9rem;border-radius:50%;background:rgba(255,255,255,.6);animation:bub 1.4s infinite}
.liq i:nth-child(1){left:20%}.liq i:nth-child(2){left:50%;animation-delay:.5s}.liq i:nth-child(3){left:75%;animation-delay:.9s}
@keyframes bub{from{transform:translateY(1rem) scale(.4);opacity:1}to{transform:translateY(-1.5rem) scale(1.1);opacity:0}}
/* quidditch */
.pitch{background:linear-gradient(#274a8a 0,#274a8a 45%,#2c7a3a 45%)}
.hoops{display:flex;gap:1.4rem;align-items:flex-end;height:90%}
.hoop{width:3.2rem;height:3.2rem;border:.4rem solid var(--gold);border-radius:50%;position:relative}
.hoop:after{content:'';position:absolute;left:50%;top:100%;width:.4rem;margin-left:-.2rem;height:5rem;background:var(--gold)}
.hoop:nth-child(2){margin-bottom:2rem}
.ball{position:absolute;left:8%;bottom:15%;width:2rem;height:2rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e0703a,#7a2410);transition:all .8s cubic-bezier(.3,.7,.4,1)}
.ball.goal{left:50%;bottom:62%;transform:translateX(-50%) scale(.6)}
.ball.saved{left:38%;bottom:5%;transform:rotate(300deg)}
.goals{position:absolute;right:.5rem;top:.4rem;display:flex;gap:.3rem;flex-direction:column;font-size:.9rem}
.goals span{padding:.05rem .5rem;border-radius:1rem;background:var(--c);border:2px solid var(--c2)}
/* mapa */
.board{height:auto;padding:.4rem;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.3rem;background:linear-gradient(135deg,#f9eecd,#e2c88d);align-items:stretch}
.cell{position:relative;min-width:0;overflow:hidden;text-align:center;line-height:1.05;min-height:3.6rem;border:2px solid #7a5226;border-radius:.4rem;background:rgba(255,255,255,.35);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem}
.cell em{font-style:normal;font-size:1.3rem;line-height:1}
.cell.sp{background:rgba(238,186,48,.45)}
.toks{display:flex;gap:.1rem;flex-wrap:wrap;justify-content:center}
.tok{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--c);border:2px solid var(--c2);font-size:.85rem;display:flex;align-items:center;justify-content:center}
.tok.me{animation:pop .7s infinite}
/* cámara */
.door{width:8rem;height:8rem;border-radius:50%;background:radial-gradient(circle,#4c6a58,#16261c);border:.5rem solid #8fa89a;display:flex;align-items:center;justify-content:center;font-size:2.6rem;transition:transform 1s}
.door.open{transform:rotateY(75deg)}
.locks{display:flex;gap:.5rem;font-size:2.4rem}
.locks span.o{filter:drop-shadow(0 0 .5rem #7dff9a)}
/* duelo */
.duel{gap:0;padding:0 1rem}
.wiz{font-size:3.6rem;filter:drop-shadow(0 0 .6rem var(--c))}
.wiz.flip{transform:scaleX(-1)}
.beam{flex:1;height:.7rem;margin:0 1rem;border-radius:1rem;position:relative;background:linear-gradient(90deg,var(--ca),#fff,var(--cb))}
.beam i{position:absolute;top:50%;width:2.4rem;height:2.4rem;margin:-1.2rem;border-radius:50%;background:radial-gradient(#fff,#ffe27a 40%,transparent 70%);transition:left .8s;animation:flick .2s infinite alternate}
.duelcols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.dcol{border:4px solid var(--c2);background:var(--c);border-radius:.8rem;padding:.5rem;display:flex;flex-direction:column;gap:.5rem;text-align:center}
.dcol.locked{opacity:.35;pointer-events:none}
.dcol button{font-size:1.35rem;background:rgba(0,0,0,.45);border:2px solid var(--c2)}
.buzz{font-size:2rem!important;min-height:5rem}
.chip.pv{display:inline-flex;align-items:center;justify-content:center;border-radius:.7rem;padding:.5rem 1rem;font-weight:bold}
.pvm{margin-bottom:.5rem}
.dhelp{text-align:center;font-size:1.15rem;margin:.4rem 0}
.duel{height:11vh;min-height:4.5rem}
.mscore{display:flex;align-items:center;justify-content:center;gap:.8rem;flex-wrap:wrap;font-size:1.15rem;margin:.2rem 0 .4rem}
.mscore b.sc{font-size:2.8rem;color:var(--gold);text-shadow:0 .15rem 0 #000;min-width:6rem;text-align:center}
.mscore small{width:100%;text-align:center;font-size:1rem;opacity:.9}
.pitch2{justify-content:space-between;padding:0 7%}
.pitch2 .ball{left:50%;bottom:38%;margin-left:-1rem}
.pitch2 .ball.goalR{left:88%;bottom:58%;transform:scale(.6)}
.pitch2 .ball.goalL{left:12%;bottom:58%;transform:scale(.6)}
.stand{width:100%;border-collapse:collapse;font-size:1rem;margin:.6rem 0}
.stand th,.stand td{padding:.25rem .4rem;text-align:center;border-bottom:1px solid rgba(120,80,20,.35)}
.stand td:first-child,.stand th:first-child{text-align:left}
.msel{font-size:1.3rem;font-weight:bold}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.dlg{max-width:38rem;width:100%;padding:1.2rem;text-align:center;max-height:96vh;overflow:auto;animation:pop .35s}
.dlg.wide{max-width:52rem;text-align:left}
.dlg.dark{background:linear-gradient(#1b1f4a,#0b1026);color:#fff;border-color:var(--gold)}
.fb-ok{border:.4rem solid #2e8b45}.fb-ko{border:.4rem solid #7a6bd1}
.sol{font-size:1.3rem;margin:.6rem 0;padding:.5rem;background:rgba(255,255,255,.55);border-radius:.5rem}
.exp{font-size:1.1rem;font-style:italic}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0}
#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#toast div{background:#000d;border:2px solid var(--gold);padding:.6rem 1.2rem;border-radius:2rem;font-size:1.15rem;animation:pop .4s}
#mute{position:fixed;left:.5rem;bottom:.5rem;z-index:40;min-height:0;padding:.3rem .6rem;font-size:1.2rem;background:#000a}
#nav{position:fixed;left:.5rem;top:.5rem;z-index:30;display:none;gap:.4rem}
body.en-home #nav{display:flex}
#nav a{font-weight:bold;font-size:.9rem;text-decoration:none;padding:.4rem .9rem;border-radius:2rem;background:linear-gradient(#f9dd7e,#c9952b);color:#2b1d0e;border:2px solid #fff1b8}
.brush.on{transform:scale(1.1);box-shadow:0 0 1rem #fff}
/* ceremonia */
.cer .hat{width:11rem;margin:0 auto}
.hat.think{animation:wob .5s infinite alternate}
@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.cname{font-size:2.6rem;font-weight:bold;color:var(--gold)}
.cres{font-size:1.8rem;min-height:3.4rem;margin:.5rem 0}
.cres .hb{font-size:2rem;animation:pop .6s}
/* libro */
.tabs{display:flex;gap:.4rem;margin:.6rem 0;flex-wrap:wrap}
.tabs button{background:#2a2350}.tabs button.on{background:var(--gold);color:var(--ink);font-weight:bold}
.qrow{display:flex;gap:.5rem;align-items:center;padding:.45rem;border-bottom:1px solid rgba(120,80,20,.35)}
.qrow .ty{font-size:1.5rem}.qrow .qt{flex:1;min-width:0}.qrow small{display:block}
.qrow button{min-height:2.3rem;padding:.3rem .6rem}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.form .w{grid-column:1/-1}
pre{background:#fffaf0;border:1px solid #b08a45;border-radius:.5rem;padding:.6rem;font-size:.78rem;white-space:pre-wrap;-webkit-user-select:text;user-select:text;max-height:16rem;overflow:auto;font-family:Consolas,monospace}
.err{color:#a11;font-weight:bold}.okc{color:#1c6b2e;font-weight:bold}
.chk{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:.3rem;margin-right:.8rem}
.chk input{width:1.3rem;height:1.3rem}
/* final */
.final{text-align:center}
.cup{font-size:6rem;animation:bob 1.6s infinite;filter:drop-shadow(0 0 1.5rem rgba(255,220,120,.9))}
.podium{display:grid;grid-template-columns:repeat(var(--nh,4),minmax(0,1fr));gap:.6rem;margin:1rem 0}
@media(max-width:700px){.podium{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
.pcard{background:var(--c);border:4px solid var(--c2);border-radius:.8rem;padding:.6rem}
.pcard.win{transform:scale(1.06);box-shadow:0 0 2rem var(--c2)}
.pcard .pp{font-size:2.6rem;font-weight:bold}
.final ol{text-align:left;font-size:1.05rem}.final li{margin:.5rem 0}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
#conf i{position:absolute;top:-2rem;width:.7rem;height:1.1rem;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.avance{display:flex;gap:3px;margin:.2rem 0 .6rem;flex-wrap:wrap;align-items:center}.avance i{flex:1 1 0;min-width:8px;height:12px;border-radius:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}.avance i.ok{background:#3fbf5f}.avance i.ko{background:#e0484f}.avance i.ya{outline:3px solid var(--gold);outline-offset:1px}.avance b{font-size:.9rem;margin:0 .2rem 0 .5rem;white-space:nowrap}.avance b:first-child{margin-left:0}

EXP: «Cobarde» significa lo contrario de «valiente».`;

/* 28/10/2026 (Javi: «faltan cosas del Tema 2» y «se repiten»): al abrir, añade solas las preguntas nuevas del banco del Tema 2

function traerBancoT2(){if(!window.JAVI||!JAVI.BASE)return;const k=q=>[q.text,String(q.read||'').slice(0,40),JSON.stringify(q.options||q.items||q.pairs||''),String(q.answer)].join('|');

let AC;
function tone(f,d,type,t0,vol){if(S.cfg.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

  ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',i*.09)),

function modal(html,cls){$('#modal').innerHTML=`<div class="ov"><div class="dlg parch ${cls||''}">${html}</div></div>`}

/* ============ PREGUNTAS: CONSTRUIR / IMPORTAR ============ */
function mapType(s){s=plain(s);if(!s)return'';if(s==='open'||/^(ab|ret)/.test(s))return'open';if(/^(op|mc|mul|test)/.test(s))return'mc';
  if(/^(v|tf|true)/.test(s))return'tf';if(/^(com|fill|hue|rell)/.test(s))return'fill';if(/^ord/.test(s))return'order';if(/^(emp|rel|match|unir)/.test(s))return'match';return''}
function normCrit(v){const m=String(v==null?'':v).match(/(\d+)\.(\d+)\s*$/);return m?m[1]+'.'+m[2]:''}
const critName=c=>c?'LCL.2.'+c:'Sin criterio';
function buildQ(raw){
  const text=String(raw.text||'').trim();if(!text)return{err:'Falta el enunciado (P:)'};
  let type=raw.type,opts=(raw.opts||[]).filter(o=>o.t!==''),r=String(raw.r==null?'':raw.r).trim();
  if(!type)type=opts.some(o=>o.ok)?'mc':/^(v|f|verdadero|falso)$/i.test(r)?'tf':'open';
  const dif=Math.min(3,Math.max(1,parseInt(raw.dif)||1));
  const q={id:uid(),subject:String(raw.subject||'General').trim()||'General',topic:String(raw.topic||'Varios').trim()||'Varios',type,text,
    difficulty:dif,points:Math.max(1,parseInt(raw.pts)||10*dif),time:Math.max(0,parseInt(raw.time)||0),explanation:String(raw.exp||'').trim()};
  const cr=normCrit(raw.crit);if(cr)q.crit=cr;if(raw.read&&String(raw.read).trim())q.read=String(raw.read).trim();
  if(type==='mc'){q.options=opts.map(o=>o.t);q.correct=opts.findIndex(o=>o.ok);if(q.options.length<2)return{err:'Hacen falta al menos 2 opciones'};if(q.correct<0)return{err:'Marca la opción correcta con *'}}
  else if(type==='tf'){const p=plain(r);if(/^(v|verdadero|true|si)$/.test(p))q.answer=true;else if(/^(f|falso|false|no)$/.test(p))q.answer=false;else return{err:'En verdadero/falso la respuesta debe ser V o F'}}
  else if(type==='fill'){if(!r)return{err:'Falta la respuesta (R:)'};q.answer=r;q.options=opts.map(o=>o.t)}
  else if(type==='order'){q.items=r.split('|').map(x=>x.trim()).filter(Boolean);if(q.items.length<2)return{err:'Hacen falta al menos 2 elementos separados por |'}}
  else if(type==='match'){q.pairs=r.split('|').map(x=>x.split('=').map(y=>y.trim())).filter(p=>p.length===2&&p[0]&&p[1]);if(q.pairs.length<2)return{err:'Hacen falta al menos 2 parejas «a = b» separadas por |'}}
  else q.answer=r;
  return{q}}
function parseText(txt){let subject='General',topic='Varios';const qs=[],errs=[];
  txt.replace(/\r/g,'').split(/\n\s*\n/).forEach((block,bi)=>{const raw={opts:[]};let has=false;
    block.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{let m;
      if(l[0]==='#'){const p=l.replace(/^#+\s*/,'').split(/\s*\|\s*|\s+-\s+/);subject=p[0]||subject;topic=p.slice(1).join(' - ')||'Varios';return}
      if(m=l.match(/^(TIPO|TEXTO|CRIT|P|R|DIF|PTS|T|EXP)\s*:\s*(.*)$/i)){has=true;const k=m[1].toUpperCase(),v=m[2];
        if(k==='CRIT'){raw.crit=v;return}if(k==='TEXTO'){raw.read=v;return}
        if(k==='TIPO')raw.type=mapType(v);else if(k==='P')raw.text=v;else if(k==='R')raw.r=v;else if(k==='DIF')raw.dif=v;else if(k==='PTS')raw.pts=v;else if(k==='T')raw.time=v;else raw.exp=v;return}
      if(m=l.match(/^([*\-])\s*(.+)$/)){has=true;raw.opts.push({t:m[2].trim(),ok:m[1]==='*'})}});
    if(!has)return;raw.subject=subject;raw.topic=topic;const b=buildQ(raw);
    if(b.q)qs.push(b.q);else errs.push(`Bloque ${bi+1}: ${b.err}`)});
  return{qs,errs}}
function fromJSON(o){const g=(...k)=>{for(const x of k)if(o[x]!==undefined&&o[x]!==null)return o[x]};
  const type=mapType(g('tipo','type')),ops=g('opciones','options')||[],cor=g('correcta','correct'),ans=g('respuesta','answer');
  const raw={subject:g('asignatura','subject'),topic:g('tema','topic'),type,text:g('pregunta','enunciado','text'),dif:g('dificultad','difficulty'),
    pts:g('puntos','points'),time:g('tiempo','time'),exp:g('explicacion','explicación','explanation'),crit:g('criterio','crit'),read:g('texto','lectura','read'),opts:[],r:''};
  if(type==='mc')raw.opts=ops.map((t,i)=>({t:String(t),ok:typeof cor==='number'?i===cor:String(t)===String(cor!==undefined?cor:ans)}));
  else if(type==='fill'){raw.r=Array.isArray(ans)?ans.join('|'):String(ans==null?'':ans);raw.opts=ops.map(t=>({t:String(t)}))}
  else if(type==='tf')raw.r=ans===true?'V':ans===false?'F':String(ans==null?'':ans);
  else if(type==='order'){const it=g('elementos','items')||ans||[];raw.r=Array.isArray(it)?it.join('|'):String(it)}
  else if(type==='match'){raw.r=(g('parejas','pairs')||[]).map(p=>Array.isArray(p)?p.join('='):(g2(p,'a','izquierda')+'='+g2(p,'b','derecha'))).join('|')}
  else raw.r=String(ans==null?'':ans);
  return raw}
const g2=(o,a,b)=>o[a]!==undefined?o[a]:o[b];
function importAny(txt){txt=txt.trim();if(!txt)return{qs:[],errs:['El cuadro está vacío']};
  if(txt[0]==='['||txt[0]==='{'){let d;try{d=JSON.parse(txt)}catch(e){return{qs:[],errs:['El JSON no es válido: '+e.message]}}
    const arr=Array.isArray(d)?d:(d.preguntas||d.questions||[]);const qs=[],errs=[];let ls='General',lt='Varios';
    arr.forEach((o,i)=>{const raw=fromJSON(o);raw.subject=ls=raw.subject||ls;raw.topic=lt=raw.topic||lt;const b=buildQ(raw);b.q?qs.push(b.q):errs.push(`Pregunta ${i+1}: ${b.err}`)});
    if(!arr.length)errs.push('No he encontrado ninguna pregunta en el JSON');return{qs,errs}}
  return parseText(txt)}
function correctText(q){switch(q.type){case'mc':return q.options[q.correct];case'tf':return q.answer?'Verdadero':'Falso';case'fill':return q.answer.split('|')[0].trim();
  case'order':return q.items.join(' ');case'match':return q.pairs.map(p=>p[0]+' → '+p[1]).join(' · ');default:return q.answer||'La valora el profe'}}

/* ============ DISPOSITIVOS: MISIONES ============
   El profe envía una misión (un lote de preguntas) a la Hoja; cada alumno (nombre + número de lista) o cada casa
   la responde a su ritmo en su aparato y, al terminar, se guarda UNA fila con sus aciertos.
   Hoja: Alumno «COPA · 4ºA» · Acción «Mision» (CartaId = id, Tipo = título o «cerrada», Carta = JSON {qs})
         y Acción «Respuesta» (CartaId = id de la misión, Tipo = «#7» o «Casa Gryffindor», Carta = JSON {r:[1,0…], s:segundos}).
   Las respuestas se guardan sin el código de profe (escribirLibre), como el farol del baño. */
const TAGC='COPA · 4ºA';let LISTA=null,CRIT=null;
function loadCrit(){if(CRIT||!window.JAVI)return;CRIT={};fetch(JAVI.BASE+'data/criterios.json').then(r=>r.json()).then(d=>{CRIT=(d.areas.LCL||{}).criterios||{}}).catch(()=>{})}
/* NOTAS POR CRITERIO: solo cuentan las respuestas individuales (#número). Nota = 10 × aciertos / preguntas de ese criterio (mínimo 1). */
function nota(ok,n){return n?Math.max(1,Math.round(100*ok/n)/10):null}
const fnota=(ok,n)=>n?String(nota(ok,n)).replace('.',','):'—';
function notasDatos(ms){const crits=[],T={};
  ms.forEach(m=>respuestas(m.id).forEach((r,w)=>{if(w[0]!=='#')return;m.qs.forEach((q,i)=>{if(i>=r.length||r[i]==null)return;const c=q.crit||'';if(!crits.includes(c))crits.push(c);
    const t=T[w]=T[w]||{},x=t[c]=t[c]||[0,0];x[0]+=r[i]?1:0;x[1]++})}));
  crits.sort((a,b)=>parseFloat(a||99)-parseFloat(b||99));
  const quien=Object.keys(T).sort((a,b)=>+a.slice(1)-+b.slice(1));return{crits,T,quien}}
function notasTabla(ms){const d=notasDatos(ms),inv={};Object.keys(LISTA||{}).forEach(n=>inv['#'+LISTA[n]]=n);
  const cab=['Nº','Alumno'];d.crits.forEach(c=>{cab.push(critName(c));cab.push('Aciertos')});cab.push('Total','Aciertos');
  const filas=d.quien.map(w=>{const f=[w.slice(1),inv[w]||'?'];let o=0,n=0;d.crits.forEach(c=>{const x=d.T[w][c]||[0,0];o+=x[0];n+=x[1];f.push(fnota(x[0],x[1]));f.push(x[1]?x[0]+' de '+x[1]:'')});f.push(fnota(o,n));f.push(o+' de '+n);return f});
  return{cab,filas}}
function loadLista(){return LISTA?Promise.resolve(LISTA):fetch(JAVI.BASE+'data/lista-4A.json',{cache:'no-store'}).then(r=>r.json()).then(d=>LISTA=d.numeros)}
function rowsC(acc){return JAVI.filas().filter(f=>plain(f.alumno)===plain(TAGC)&&plain(f.accion)===acc)}
function jrow(f){const i=f.carta.indexOf('{');if(i<0)return null;try{return JSON.parse(f.carta.slice(i))}catch(e){return null}}
function misiones(){const m=new Map();rowsC('mision').forEach(f=>{if(plain(f.tipo)==='cerrada'){const o=m.get(f.cartaId);if(o)o.cerrada=true;return}
  const j=jrow(f);if(!j||!j.qs||!j.qs.length)return;
  /* las misiones largas van en varias filas (partes de 12 preguntas): {p:nº de parte, of:total, qs} */
  let o=m.get(f.cartaId);if(!o||!j.of){o={id:f.cartaId,titulo:f.tipo,dia:f.dia,of:j.of||1,partes:{}};m.set(f.cartaId,o)}
  o.partes[j.p||1]=j.qs;if((j.p||1)===1){if(j.niv)o.niv=j.niv;if(j.tiempo)o.tiempo=j.tiempo;if(j.tniv)o.tniv=j.tniv;if(j.nivr)o.nivr=j.nivr;if(j.gal)o.gal=j.gal;if(j.pase)o.pase=j.pase}});
  const out=[];m.forEach(o=>{const ks=Object.keys(o.partes);if(ks.length<o.of)return;o.qs=[];for(let i=1;i<=o.of;i++)o.qs=o.qs.concat(o.partes[i]||[]);out.push(o)});return out.reverse()}
function respuestas(id){const m=new Map();rowsC('respuesta').forEach(f=>{if(f.cartaId!==id||m.has(f.tipo))return;const j=jrow(f);if(j&&j.r){let r=j.r;if(Array.isArray(j.o)&&j.o.length){r=new Array(Math.max(j.o.length,Math.max.apply(null,j.o.filter(x=>x!=null))+1)).fill(null);j.r.forEach((v,k)=>{if(j.o[k]!=null)r[j.o[k]]=v})}if(j.nv!=null)r.nv=j.nv;m.set(f.tipo,r)}});return m}
const cnt=a=>(a||[]).filter(x=>x!=null).length;

function candidatosPremio(m,rs,inv){const ya=premiados(m.id);return [...rs.entries()].filter(([w,x])=>w[0]==='#'&&inv[w]&&cnt(x)&&sum(x)/cnt(x)>=PREMIO_MIN).map(([w,x])=>({n:inv[w],ok:sum(x),de:cnt(x),ya:ya.includes(inv[w])}))}

/* 🧗 MISIONES POR NIVELES (30/10/2026, Javi). Desde la tarde del 30/10: 5 NIVELES FIJOS (decisión de Javi):
   nivel 1 = 3 preguntas · 2 min · 1 galeón; 2 = 5 · 3 min · 1; 3 = 8 · 4 min · 2; 4 = 10 · 5 min · 3; 5 = 15 · 8 min · 4.
   Se SUBE de nivel con el 60 %; los galeones de cada nivel piden el 90 %. Las preguntas van de más fáciles a más difíciles.
   🔁 REINTENTO (Javi): cada nivel lleva preguntas de RESERVA (m.nivr; van al final de m.qs). Si no llega al 60 % (o se le acaba el
   tiempo), repite ese nivel UNA vez con las de reserva; si tampoco, la misión acaba ahí. La partida va por tramos en el orden jugado:
   d.seg = [{k, ini, n, idx, intento}] (idx = índices de m.qs), d.ord = todos los idx seguidos.
   m.niv, m.nivr, m.tniv (segundos), m.gal, m.pase = 0.9. Las misiones de 3 niveles de antes (sin gal) siguen con el 70 % y sin reserva. */
const NIVN=['🟢 Nivel 1','🔵 Nivel 2','🟡 Nivel 3','🟠 Nivel 4','🔴 Nivel 5'],PASE=0.7;
const NIV5={tam:[3,5,8,10,15],seg:[120,180,240,300,480],gal:[1,1,2,3,4],pase:0.9};
const nivNom=k=>NIVN[k]||'⭐ Nivel '+(k+1),paseDe=m=>m.pase||PASE;
const SUBIR=0.6,subirDe=m=>m.gal?SUBIR:paseDe(m);
const rango=(a,n)=>Array.from({length:n},(_,j)=>a+j);
function bloquesNivel(m){const pri=[],res=[];let i=0;(m.niv||[]).forEach(n=>{pri.push(rango(i,n));i+=n});(m.nivr||[]).forEach(n=>{res.push(rango(i,n));i+=n});return{pri,res}}
/* galeones con las respuestas en el orden de la misión (profe): un nivel cuenta si su tanda principal o la de reserva llega al 90 % */
function galDe(m,r){const b=bloquesNivel(m);let g=0;(m.niv||[]).forEach((n,k)=>{if([b.pri[k],b.res[k]].some(ix=>ix&&ix.length&&ix.every(i=>r[i]!=null)&&sum(ix.map(i=>r[i]))/ix.length>=paseDe(m)-1e-9))g+=(m.gal||[])[k]||0});return g}
function porNiveles(qs){const A=shuffle(qs).sort((a,b)=>(a.difficulty||1)-(b.difficulty||1)),L=A.length,T=NIV5.tam,out=[],niv=[],lv=[];
  /* con banco de sobra: niveles 1-2 de las más fáciles, 4-5 de las más difíciles y el 3 del medio; si no, seguidas */
  const tramos=L>=T.reduce((x,y)=>x+y,0)+10?[[0,3],[3,8],[Math.floor(L/2)-4,Math.floor(L/2)+4],[L-25,L-15],[L-15,L]]:(()=>{let i=0;return T.map(n=>[i,i+=n])})();
  tramos.forEach(([x,y])=>{const l=A.slice(Math.max(0,x),Math.min(L,y));if(l.length){out.push(...l);niv.push(l.length);lv.push(l)}});
  /* reserva: para cada nivel, otras tantas preguntas sin usar de la dificultad más parecida */
  const usadasN=new Set(out);let R=shuffle(A.filter(q=>!usadasN.has(q)));const res=[],nivr=[];
  lv.forEach(l=>{const d0=l.reduce((a,q)=>a+(q.difficulty||1),0)/l.length;R.sort((a,b)=>Math.abs((a.difficulty||1)-d0)-Math.abs((b.difficulty||1)-d0));const t=R.splice(0,l.length);res.push(...t);nivr.push(t.length)});
  return{qs:out.concat(res),niv,nivr,tniv:NIV5.seg.slice(0,niv.length),gal:NIV5.gal.slice(0,niv.length),pase:NIV5.pase}}
function nivelDe(m,i){if(!m.niv)return null;let ini=0;for(let k=0;k<m.niv.length;k++){if(i<ini+m.niv[k])return{k,ini,n:m.niv[k]};ini+=m.niv[k]}return null}
function mezclar(ix,rnd){const b=ix.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function tramosIniciales(m,who){if(!m.niv)return null;const rnd=semilla(m.id+'|'+who);let ini=0;return bloquesNivel(m).pri.map((ix,k)=>{const s={k,ini,n:ix.length,idx:mezclar(ix,rnd),intento:1};ini+=ix.length;return s})}
function segDe(d,i){return (d.seg||[]).find(s=>i>=s.ini&&i<s.ini+s.n)||null}
const tramoOk=(d,s,p)=>{const t=d.res.slice(s.ini,s.ini+s.n);return t.length===s.n&&sum(t)/s.n>=p-1e-9};
function nivelAlcanzado(d){if(d.nvFin!=null)return d.nvFin;const pas=new Set();(d.seg||[]).forEach(s=>{if(tramoOk(d,s,subirDe(d.m)))pas.add(s.k)});let c=0;while(pas.has(c))c++;return c}
function galJugado(d){const g=new Set();(d.seg||[]).forEach(s=>{if(tramoOk(d,s,paseDe(d.m)))g.add(s.k)});let x=0;g.forEach(k=>x+=(d.m.gal||[])[k]||0);return x}
const galHasta=(m,c)=>(m.gal||[]).slice(0,c).reduce((a,b)=>a+b,0);
/* al terminar un tramo: ¿sube, repite con la reserva o se acaba? (devuelve true si ya ha pintado algo) */
function finDeNivel(d){const m=d.m;if(!m.niv||d.end||!d.seg)return false;const s=segDe(d,d.i-1);if(!s||d.i!==s.ini+s.n)return false;
  const ok=sum(d.res.slice(s.ini,s.ini+s.n));
  if(ok/s.n<subirDe(m)-1e-9){
    const r=bloquesNivel(m).res[s.k];
    if(s.intento===1&&r&&r.length){
      const ns={k:s.k,ini:d.i,n:r.length,idx:mezclar(r,semilla(m.id+'|'+d.who.id+'|r'+s.k)),intento:2};
      d.seg.splice(d.seg.indexOf(s)+1,0,ns);let ini=0;d.seg.forEach(x=>{x.ini=ini;ini+=x.n});d.ord=[].concat(...d.seg.map(x=>x.idx));d.sinTiempo=false;
      try{localStorage.removeItem('copa-nivt|'+m.id+'|'+d.who.id+'|'+s.k+'|2')}catch(e){}
      SFX.ko();modal(`<h2>😕 ${nivNom(s.k)}: ${ok} de ${s.n}</h2><p style="font-size:1.3rem">Para subir necesitabas ${Math.ceil(subirDe(m)*s.n-1e-9)}. <b>¡Tienes otra oportunidad!</b> ${r.length} preguntas nuevas${m.tniv?' en '+Math.round(m.tniv[s.k]/60)+' minutos':''}.</p><button class="gold big" data-a="devsigue">🔁 ¡Otra vez! ▶</button>`,'fb-ko');return true}
    d.nvFin=s.k;d.end=true;return false}
  if(s.k===m.niv.length-1)return false;
  const g=m.gal&&m.gal[s.k],conG=g&&ok/s.n>=paseDe(m)-1e-9,falta=Math.ceil(paseDe(m)*s.n-1e-9),sig=d.seg[d.seg.indexOf(s)+1];

   propio orden (siempre el mismo para él: semilla = misión + quién, así puede seguir donde lo dejó). En las de niveles se baraja dentro
   de cada nivel. Se guarda o = orden jugado, y respuestas() lo devuelve en el orden de la misión. */
function semilla(t){let h=2166136261;for(let i=0;i<t.length;i++)h=Math.imul(h^t.charCodeAt(i),16777619);
  return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function ordenAlumno(m,who){const rnd=semilla(m.id+'|'+who),o=[];let ini=0;
  (m.niv||[m.qs.length]).forEach(n=>{const b=[];for(let k=0;k<n;k++)b.push(ini+k);for(let i=b.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[b[i],b[j]]=[b[j],b[i]]}o.push(...b);ini+=n});return o}

function playHouses(){const hs=HK.filter(h=>S.students.some(s=>s.house===h));return hs.length?hs:HK.slice()}
const choice=q=>q.type==='mc'||q.type==='tf'||(q.type==='fill'&&q.options&&q.options.length>0);
function compat(k,q){if(k==='snitch')return choice(q);if(k==='pociones')return q.type==='order';if(k==='duelo')return playHouses().length>1;return true}
function pickGame(q){const c=S.cfg;if(c.gameMode!=='random'&&compat(c.gameMode,q))return c.gameMode;
  let l=Object.keys(GAMES).filter(k=>c.games[k]!==false&&compat(k,q));if(!l.length)l=['mapa','camara','quidditch'];
  if(q.type==='order'&&l.includes('pociones')&&Math.random()<.6)return'pociones';
  const l2=l.filter(k=>k!==S.session.lastGame);return pick(l2.length?l2:l)}

const K_USADAS='copa-usadas';

function newSession(){const c=S.cfg,u=usadas();let qs=shuffle(S.questions.filter(q=>V.sel.has(gkey(q)))).sort((a,b)=>(u[a.id]||0)-(u[b.id]||0));if(c.maxQ>0)qs=qs.slice(0,c.maxQ);qs=shuffle(qs);
  const z=v=>({g:v,h:v,r:v,s:v,f:v}),j={};ALLH.forEach(h=>j[h]={help:c.jokers,fifty:c.jokers,time:c.jokers});
  S.session={queue:qs.map(q=>q.id),i:0,pts:z(0),ok:z(0),ko:z(0),failed:[],bag:{},turn:0,jok:j,goals:z(0),map:{pos:z(0),skip:z(false)},locks:z(0),round:null,lastGame:'',ended:false,mode:c.mode==='match'?'match':'mix',mgame:c.matchGame==='duelo'?'duelo':'quidditch',matches:[],match:null};save()}
function peek(h){const ss=S.session,out=ss.out||{},ids=S.students.filter(s=>s.house===h&&!out[s.id]).map(s=>s.id);if(!ids.length)return null;
  ss.bag[h]=(ss.bag[h]||[]).filter(id=>ids.includes(id));if(!ss.bag[h].length)ss.bag[h]=shuffle(ids);return ss.bag[h][ss.bag[h].length-1]}
/* ============ COMPETICIÓN POR PARTIDOS ============
   Un partido enfrenta a dos casas con el mismo minijuego. En cada pregunta responden las dos a la vez:
   quien acierta primero, marca. «Al mejor de N»: se acaba cuando una ya no puede ser alcanzada;
   si se llega al final empatadas, desempate (el primero que marque gana). Ganar el partido: +20 puntos. */
const BONO_PARTIDO=20;
function standings(){const ss=S.session,t={};playHouses().forEach(h=>t[h]={h,pj:0,g:0,e:0,p:0,gf:0,gc:0});
  (ss.matches||[]).forEach(m=>{const A=t[m.a],B=t[m.b];if(!A||!B)return;A.pj++;B.pj++;A.gf+=m.ga;A.gc+=m.gb;B.gf+=m.gb;B.gc+=m.ga;if(!m.w){A.e++;B.e++}else{t[m.w].g++;t[m.w===m.a?m.b:m.a].p++}});
  return Object.values(t).sort((x,y)=>y.g-x.g||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf)}
function standHTML(){const ss=S.session;if(!ss.matches||!ss.matches.length)return'';const un=ss.mgame==='duelo'?'Hechizos':'Goles';
  return `<table class="stand"><tr><th>Casa</th><th>Jugados</th><th>Ganados</th><th>Perdidos</th><th>${un}</th></tr>${standings().map(r=>`<tr><td>${HOUSES[r.h].e} ${HOUSES[r.h].n}</td><td>${r.pj}</td><td><b>${r.g}</b></td><td>${r.p}</td><td>${r.gf} – ${r.gc}</td></tr>`).join('')}</table>
  <p style="font-size:.95rem">${ss.matches.map(m=>`${HOUSES[m.a].e} ${m.ga} – ${m.gb} ${HOUSES[m.b].e}`).join(' &nbsp;·&nbsp; ')}</p>`}

  const st=standings(),pj={};st.forEach(r=>pj[r.h]=r.pj);
  const faced=(x,y)=>ss.matches.filter(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x)).length;
  const a=hs.slice().sort((x,y)=>pj[x]-pj[y])[0],b=hs.filter(h=>h!==a).sort((x,y)=>pj[x]-pj[y]||faced(a,x)-faced(a,y))[0];
  const sel=(id,v)=>`<select id="${id}" class="msel">${hs.map(h=>`<option value="${h}" ${h===v?'selected':''}>${HOUSES[h].e} ${HOUSES[h].n}</option>`).join('')}</select>`;
  $('#stage').innerHTML=`<div class="intro parch"><div class="rn">Partido ${ss.matches.length+1} · quedan ${left} preguntas</div><div class="ge">${G.e}</div><h2>${ss.mgame==='duelo'?'Duelo de varitas':'Partido de Quidditch'}</h2>
  <p>Las dos casas responden a la vez: quien acierta primero, ${ss.mgame==='duelo'?'lanza el hechizo':'marca gol'}. Ganar el partido vale +${BONO_PARTIDO} puntos.</p>
  <div class="row">${sel('mA',a)}<b class="vs">VS</b>${sel('mB',b)}</div>
  <div class="row"><label>Formato <select id="mN">${[3,5,7,10].map(x=>`<option value="${x}" ${x===(S.cfg.matchN||5)?'selected':''}>Al mejor de ${x}</option>`).join('')}</select></label></div>
  <button class="gold big" data-a="mstart">✨ ¡Que empiece el partido!</button>${standHTML()}
  <div class="row"><button data-a="finish">🏁 Terminar y entregar la Copa</button></div></div>`}
function matchSkin(){const ss=S.session,m=ss.match,un=ss.mgame==='duelo';
  const head=`<div class="mscore">${hb(m.a)}<b class="sc" id="msc">${m.ga} – ${m.gb}</b>${hb(m.b)}<small>${m.tb?'⚡ Desempate: la primera casa que acierte gana el partido':'Pregunta '+(m.q+1)+' de '+m.n+' · al mejor de '+m.n}</small></div>`;
  const add=h=>{h===m.a?m.ga++:m.gb++;const e=$('#msc');if(e)e.textContent=m.ga+' – '+m.gb};
  if(un){const pos=()=>Math.max(6,Math.min(94,50+(m.ga-m.gb)*(88/(m.n+1))));
    return{scene:head+`<div class="scene duel"><div class="wiz" style="--c:${HOUSES[m.a].c2}">🧙</div><div class="beam" style="--ca:${HOUSES[m.a].c};--cb:${HOUSES[m.b].c}"><i id="spark" style="left:${pos()}%"></i></div><div class="wiz flip" style="--c:${HOUSES[m.b].c2}">🧙</div></div>`,
      win(h){add(h);const sp=$('#spark');if(sp)sp.style.left=pos()+'%';return `✨ ¡Hechizo de ${HOUSES[h].n}! Van ${m.ga} – ${m.gb}.`}}}

    win(h){add(h);const bl=$('#ball');if(bl)bl.classList.add(h===m.a?'goalR':'goalL');return `🏟️ ¡GOOOL de ${HOUSES[h].n}! Van ${m.ga} – ${m.gb}.`}}}
function matchNext(){const ss=S.session,m=ss.match;stopTimer();cancelAnimationFrame(V.raf);
  if(!m){if(ss.i>=ss.queue.length)return endSession();return matchSetup()}
  let q;while(ss.i<ss.queue.length&&!(q=qById(ss.queue[ss.i])))ss.i++;
  marcarUsada(q);
  const rem=m.n-m.q;let done=false;
  if(m.tb)done=m.ga!==m.gb;
  else if(Math.abs(m.ga-m.gb)>rem)done=true;
  else if(rem<=0){if(m.ga!==m.gb)done=true;else{m.tb=true;toast('⚡ ¡Empate! Desempate: la primera casa que acierte gana')}}
  if(done||!q)return matchEnd();
  let team=S.cfg.part==='team';if([m.a,m.b].some(h=>!S.students.some(st=>st.house===h)))team=true;
  const r=ss.round={game:ss.mgame,houses:[m.a,m.b],team,players:{}};
  if(!team)r.houses.forEach(h=>{const id=peek(h);if(id){r.players[h]=id;ss.bag[h].pop()}});
  V.mult=1;V.skin=matchSkin();save();updateScore();GAMEFN.duelo()}
function matchEnd(){const ss=S.session,m=ss.match,w=m.ga>m.gb?m.a:m.gb>m.ga?m.b:null;

  if(w)ss.pts[w]+=BONO_PARTIDO;else{ss.pts[m.a]+=BONO_PARTIDO/2;ss.pts[m.b]+=BONO_PARTIDO/2}
  save();updateScore(w);SFX.fanfare();const left=ss.queue.length-ss.i;
  modal(`<div style="font-size:4rem">🏆</div><h2>${w?'¡'+HOUSES[w].e+' '+HOUSES[w].n+' gana el partido!':'¡Empate! Se acabaron las preguntas'}</h2>
  <p style="font-size:2rem;margin:.3rem">${HOUSES[m.a].e} ${m.ga} – ${m.gb} ${HOUSES[m.b].e}</p>
  <p style="font-size:1.2rem">${w?'+'+BONO_PARTIDO+' puntos para '+hb(w):'+'+BONO_PARTIDO/2+' puntos para cada casa'}</p><p>¡Gran partido de las dos casas! Un aplauso para el rival.</p>
  <button class="gold big" data-a="mnext">${left>0?'Siguiente partido ▶':'🏆 Ver la Copa de las Casas'}</button>`,'fb-ok')}

function nextRound(fg,ft){const ss=S.session;stopTimer();cancelAnimationFrame(V.raf);
  if(ss.mode==='match')return matchNext();

  if(game==='mapa'){let k=0;while(ss.map.skip[hs[ss.turn%n]]&&k++<n){const h=hs[ss.turn%n];ss.map.skip[h]=false;toast(`🍫 ${HOUSES[h].n} se recupera del dementor con chocolate y pasa el turno`);ss.turn++}}
  const h1=hs[ss.turn%n],houses=game==='duelo'?[h1,hs[(ss.turn+1)%n]]:[h1];

  ss.round={game,houses,team,players:{}};save();showIntro()}

function endSession(){const ss=S.session;stopTimer();cancelAnimationFrame(V.raf);

/* temporizador */
const T={id:null,left:0,total:1,cb:null};
/* 28/10/2026 (Javi: «unas preguntas necesitan más tiempo y otras menos»): sin T: propio, el tiempo sale del tipo y de lo que hay que leer.
   «Tiempo por pregunta» de los Ajustes sigue mandando como escala (40 = normal, 60 = todo más largo, 0 = sin límite). */
function timeFor(q){if(q.time)return q.time;if(q.type==='open'||!S.cfg.defTime)return 0;
  const pal=t=>String(t||'').split(/\s+/).filter(Boolean).length,largo=l=>(l||[]).some(x=>String(x).length>18);
  let t={tf:15,mc:20,fill:25}[q.type]||20;
  if(q.type==='mc'&&largo(q.options))t+=10;
  if(q.type==='order')t=12+6*q.items.length+(largo(q.items)?4*q.items.length:0);
  if(q.type==='match')t=12+8*q.pairs.length+(q.pairs.some(x=>String(x[1]).length>18)?3*q.pairs.length:0);
  t+=Math.max(0,pal(q.text)-12);if(q.read)t+=Math.round(pal(q.read)/3);t+=5*((q.difficulty||1)-1);
  t=Math.round(t*S.cfg.defTime/40/5)*5;return Math.max(10,Math.min(150,t))}
function startTimer(sec,cb){stopTimer();const el=$('#timer');if(!sec){if(el)el.innerHTML='';return}
  T.left=T.total=sec;T.cb=cb;drawTimer();
  T.id=setInterval(()=>{if(V.paused)return;T.left--;if(T.left<=5&&T.left>0)SFX.tick();drawTimer();if(T.left<=0){stopTimer();cb&&cb()}},1000)}
function stopTimer(){clearInterval(T.id);T.id=null}
function addTime(n){if(!T.id)return;T.left+=n;T.total=Math.max(T.total,T.left);drawTimer()}
function drawTimer(){const el=$('#timer');if(el)el.innerHTML=`<div class="tbar"><i style="width:${100*T.left/T.total}%"></i></div><b>⏳ ${T.left}</b>`}
/* armazón común */
const readBox=q=>q.read?`<div class="readbox parch">📖 ${esc(q.read)}</div>`:'';
const fmtQ=q=>esc(q.text).replace(/_{2,}/g,'<span class="blank"></span>');

  ${scene||''}${readBox(q)}<div class="qcard parch"><div class="qmeta">${esc(gkey(q))} · ${'⭐'.repeat(q.difficulty)} · ${q.points} puntos</div><div class="qtext">${fmtQ(q)}</div></div>
  <div id="ans"></div><div id="jok"></div></div>`}
function choiceList(q){if(q.type==='mc')return shuffle(q.options.map((t,i)=>({t,ok:i===q.correct})));
  if(q.type==='tf')return[{t:'✔ Verdadero',ok:q.answer===true},{t:'✘ Falso',ok:q.answer===false}];
  return shuffle([{t:q.answer.split('|')[0].trim(),ok:true},...q.options.map(t=>({t,ok:false}))])}
/* widget de respuesta genérico: llama a cb(true/false) una sola vez */
function mountAnswer(el,q,cb,o){o=o||{};V.fifty=null;let fin=false;const done=ok=>{if(fin)return;fin=true;V.fifty=null;cb(ok)};
  if(choice(q)){const ops=choiceList(q);
    el.innerHTML=`<div class="opts">${ops.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>`;
    const bs=[...el.querySelectorAll('.opt')];
    bs.forEach(b=>b.onclick=()=>{if(fin)return;const x=ops[b.dataset.i];b.classList.add(x.ok?'good':'bad');bs.forEach((bb,i)=>{if(ops[i].ok)bb.classList.add('good')});done(x.ok)});
    if(ops.filter(x=>!x.ok).length>=3)V.fifty=()=>{shuffle(bs.filter((b,i)=>!ops[i].ok)).slice(0,2).forEach(b=>b.classList.add('gone'));V.fifty=null}}
  else if(q.type==='fill'){el.innerHTML=`<div class="fillrow"><input id="fin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…"><button class="gold big" id="fok">Comprobar</button></div>`;
    const go=()=>{const v=norm($('#fin').value);if(!v)return;done(q.answer.split('|').some(a=>norm(a)===v))};$('#fok').onclick=go;$('#fin').onkeydown=e=>{if(e.key==='Enter')go()}}
  else if(q.type==='order'){let pool=q.items.map(t=>({t})),sel=[],tries=o.tries||1;
    for(let k=0;k<6;k++){pool=shuffle(pool);if(pool.some((x,i)=>x.t!==q.items[i]))break}
    const draw=()=>{el.innerHTML=`<div class="ordline">${sel.map((x,i)=>`<button class="chip" data-s="${i}">${esc(x.t)}</button>`).join('')||'<span class="hint">Toca los elementos en orden…</span>'}</div>
      <div class="ordpool">${pool.map((x,i)=>`<button class="chip" data-p="${i}">${esc(x.t)}</button>`).join('')}</div><div class="row"><button class="gold big" id="ochk" ${pool.length?'disabled':''}>Comprobar</button></div>`;
      el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click();sel.push(pool.splice(+b.dataset.p,1)[0]);draw()});
      el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pool.push(sel.splice(+b.dataset.s,1)[0]);draw()});
      $('#ochk').onclick=()=>{const ok=sel.every((x,i)=>x.t===q.items[i]);if(ok){el.querySelectorAll('.chip').forEach(c=>c.classList.add('good'));return done(true)}
        if(--tries>0){o.onMiss&&o.onMiss();pool=shuffle(sel);sel=[];draw()}else done(false)}};draw()}
  else if(q.type==='match'){const COL=['#ffb3ba','#bae1ff','#baffc9','#ffffba','#e0bbff','#ffd8a8','#c7f0ea','#f5c6e0'];
    const Rt=shuffle(q.pairs.map((p,i)=>i)),link={};let cur=null;
    const draw=()=>{const used={};Object.keys(link).forEach(l=>used[link[l]]=l);const all=Object.keys(link).length===q.pairs.length;
      el.innerHTML=`<div class="match">${q.pairs.map((p,i)=>`<button data-l="${i}" class="${cur===i?'cur':''}" style="${link[i]!==undefined?'background:'+COL[i%8]:''}">${esc(p[0])}</button><button data-r="${Rt[i]}" style="${used[Rt[i]]!==undefined?'background:'+COL[used[Rt[i]]%8]:''}">${esc(q.pairs[Rt[i]][1])}</button>`).join('')}</div>
      <div class="row"><span class="hint">Toca uno de la izquierda y luego su pareja.</span><button class="gold big" id="mchk" ${all?'':'disabled'}>Comprobar</button></div>`;
      el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{SFX.click();cur=+b.dataset.l;draw()});
      el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(cur===null)return;const r=+b.dataset.r;Object.keys(link).forEach(l=>{if(link[l]===r)delete link[l]});link[cur]=r;cur=null;SFX.click();draw()});
      $('#mchk').onclick=()=>done(q.pairs.every((p,i)=>q.pairs[link[i]][1]===p[1]))};draw()}
  else{el.innerHTML=`<div class="openbox"><p>👩‍🏫 El profe decide si el hechizo ha salido bien:</p>${q.answer?`<details><summary>Ver respuesta orientativa</summary>${esc(q.answer)}</details>`:''}
    <div class="row"><button class="big good" id="oy">✔ ¡Conseguido!</button><button class="big bad" id="on">✘ Todavía no</button></div></div>`;$('#oy').onclick=()=>done(true);$('#on').onclick=()=>done(false)}}

  el.innerHTML=`<div class="jokers"><span>Comodines de ${HOUSES[h].n}:</span>

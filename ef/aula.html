      $('esc').innerHTML = '<div class="grande">❌ Era «' + esc(q[3][0].toUpperCase()) + '»</div><div class="reto">💪 Reto: ' + esc(reto) + '</div><button class="btn" id="bVale" type="button">▶ Hecho, seguimos</button>'; voz('Reto: ' + reto);
      $('bVale').onclick = function(){ avanzar(true); }; };
    $('bPas').onclick = function(){ SON.tic(); avanzar(true); };
    clearInterval(it); it = setInterval(function(){ if(mia !== ROSCO_N || !document.body.contains($('eqs'))){ clearInterval(it); return; } r.t--; pintarEq(); if(r.t <= 10 && r.t > 0) SON.tic(); if(r.t <= 0){ clearInterval(it); avanzar(true); } }, 1000); T.push(it);
  }
  function avanzar(cambia){ clearInterval(it); var r = R[eq];
    if(R.every(acabado)) return final();
    if(cambia || acabado(r)){ var otro = 1 - eq; if(!acabado(R[otro])){ siguiente(r); eq = otro; return aviso(); } }
    if(!siguiente(r)){ var o = 1 - eq; if(acabado(R[o])) return final(); eq = o; return aviso(); }
    pintar(); }
  function aviso(){ var r = R[eq]; if(r.est[r.i] !== 0) siguiente(r); pintarEq(); $('esc').innerHTML = '<div class="grande">Turno del equipo ' + (eq + 1) + '</div><button class="btn" id="bVa" type="button">▶ ¡Vamos!</button>'; $('bVa').onclick = pintar; }
  function final(){ clearInterval(it); pintarEq(); var a = R[0].ok, b = R[1].ok; SON.fin();
    $('esc').innerHTML = '<div class="grande">' + (a === b ? '🤝 ¡Empate!' : '🏆 ¡Gana el equipo ' + (a > b ? 1 : 2) + '!') + '</div><div class="nota">Equipo 1: ' + a + ' aciertos · Equipo 2: ' + b + ' aciertos</div><button class="btn" id="bOtra" type="button">🔁 Otra partida</button>';
    $('bOtra').onclick = rosco; }
  /* 9/11/2026 (Javi): 4 minutos por equipo y la voz se puede quitar («yo leo, para ir más rápido»); se recuerda en el aparato */
  function pintaVoz(){ $('bVoz').textContent = vozRosco ? '🔊 La definición se lee sola' : '🔇 Sin voz: la leo yo'; $('bVoz').setAttribute('aria-pressed', vozRosco ? 'false' : 'true'); }
  $('bVoz').onclick = function(){ vozRosco = !vozRosco; try{ localStorage.setItem('ef-aula-voz-rosco', vozRosco ? 'si' : 'no'); }catch(e){} if(!vozRosco && window.speechSynthesis) speechSynthesis.cancel(); pintaVoz(); }; pintaVoz();
  $('bR').onclick = rosco; pintarEq(); aviso();
}
/* ---------- pestañas ---------- */
var VISTAS = { dados:dados, estatuas:estatuas, mimica:mimica, rosco:rosco };
function ir(p){ parar(); if(!VISTAS[p]) p = 'dados'; Array.prototype.forEach.call(document.querySelectorAll('#pest button'), function(b){ b.setAttribute('aria-pressed', b.dataset.p === p ? 'true' : 'false'); });
  history.replaceState(null, '', '#' + p); VISTAS[p](); }
Array.prototype.forEach.call(document.querySelectorAll('#pest button'), function(b){ b.onclick = function(){ ir(b.dataset.p); }; });
$('bPant').onclick = function(){ if(window.JAVI) JAVI.pantallaCompleta(); };
function pintaSon(){ $('bSon').textContent = sonido ? '🔊' : '🔇'; }
$('bSon').onclick = function(){ sonido = !sonido; try{ localStorage.setItem('ef-aula-sonido', sonido ? 'si' : 'no'); }catch(e){} if(!sonido) parar(); pintaSon(); }; pintaSon();
ir((location.hash || '#dados').slice(1));
})();
